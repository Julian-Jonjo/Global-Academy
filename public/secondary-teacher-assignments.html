<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Education Academy | Teacher Assignments</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #222; background-image: url('/images/school-bg.jpg'); background-size: cover; background-position: center; background-attachment: fixed; position: relative; min-height: 100vh; }
        body::before { content: ''; position: fixed; inset: 0; background: rgba(255, 255, 255, 0.85); z-index: 0; }
        .header { background: #1a3c6e; color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-logo { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; }
        .header-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .header-title h1 { margin: 0; font-size: 18px; }
        .header-title p { margin: 0; font-size: 11px; color: #a0c4ff; }
        .user-info { text-align: right; font-size: 13px; color: white; }
        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px 80px; position: relative; z-index: 1; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h2 { margin: 0; color: #1f2937; }
        .back-btn { background: #6b7280; color: white; border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: bold; }
        .card { background: white; border-radius: 10px; padding: 22px; box-shadow: 0 3px 15px rgba(0,0,0,0.07); margin-bottom: 20px; }
        .card-header { margin-bottom: 18px; }
        .card-header h3 { margin: 0; font-size: 18px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1/-1; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #374151; }
        .form-group select { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
        .btn { border: none; border-radius: 6px; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #1a3c6e; color: white; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f9fafb; text-align: left; padding: 12px 10px; font-size: 11px; text-transform: uppercase; color: #6b7280; border-bottom: 2px solid #e5e7eb; }
        td { padding: 12px 10px; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
        .empty { text-align: center; padding: 30px; color: #6b7280; }
        .error { text-align: center; padding: 30px; color: #b91c1c; }
        .logout-bottom { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <img src="/images/logo.png" alt="GEA" onerror="this.style.display='none'; this.parentElement.textContent='🏫';">
            </div>
            <div class="header-title">
                <h1>GLOBAL EDUCATION ACADEMY SECONDARY SCHOOL</h1>
                <p>Teacher Assignments</p>
            </div>
        </div>
        <div id="userInfo" class="user-info"></div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>Assign Teacher to Class & Subject</h2>
            <button class="back-btn" onclick="window.location.href='secondary-teachers.html'">← Back</button>
        </div>

        <div class="card">
            <div class="card-header"><h3>New Assignment</h3></div>
            <form id="assignmentForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Teacher *</label>
                        <select id="teacherSelect" required><option value="">Loading teachers...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Class *</label>
                        <select id="classSelect" required><option value="">Loading classes...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Subject *</label>
                        <select id="subjectSelect" required><option value="">Loading subjects...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Academic Year</label>
                        <select id="yearSelect"><option value="1">2026/2027</option></select>
                    </div>
                    <div class="form-group full">
                        <button type="submit" class="btn btn-primary">Assign Teacher</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-header"><h3>Current Assignments</h3></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Teacher</th>
                            <th>Subject</th>
                            <th>Class</th>
                            <th>Academic Year</th>
                        </tr>
                    </thead>
                    <tbody id="assignmentsTable">
                        <tr><td colspan="4" class="empty">Loading assignments...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <button class="logout-bottom" onclick="logout()">🚪 Logout</button>

<script>
    const token = sessionStorage.getItem('authToken');
    const userData = sessionStorage.getItem('user');
    if (!token || !userData) { window.location.href = '/login.html'; }

    const user = JSON.parse(userData);
    document.getElementById('userInfo').textContent = `${user.full_name || 'User'} (${user.role_name})`;

    function logout() { sessionStorage.removeItem('authToken'); sessionStorage.removeItem('user'); window.location.href = '/login.html'; }
    function escapeHtml(value) { if (value === null || value === undefined) return ''; return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

    let teachers = [];
    let classes = [];
    let subjects = [];
    let assignments = [];

    async function loadTeachers() {
        try {
            const response = await fetch('/api/teachers', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            teachers = (Array.isArray(data) ? data : []).filter(t => {
                const section = String(t.school_section || '').toLowerCase();
                return section.includes('secondary') || section.includes('jss') || section.includes('sss');
            });
            const select = document.getElementById('teacherSelect');
            select.innerHTML = '<option value="">Select teacher</option>';
            teachers.forEach(t => {
                const name = [t.first_name, t.middle_name, t.last_name].filter(Boolean).join(' ');
                select.add(new Option(`${name} (${t.staff_number})`, t.teacher_id || t.id));
            });
        } catch (error) { console.error('Teachers error:', error); }
    }

    async function loadClasses() {
        try {
            const response = await fetch('/api/classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            classes = (Array.isArray(data) ? data : []).filter(c => ['JSS', 'SSS', 'Secondary'].includes(c.school_section));
            const select = document.getElementById('classSelect');
            select.innerHTML = '<option value="">Select class</option>';
            classes.forEach(c => {
                select.add(new Option(`${c.class_name}${c.arm ? ' - ' + c.arm : ''}`, c.class_id));
            });
        } catch (error) { console.error('Classes error:', error); }
    }

    async function loadSubjects() {
        try {
            const response = await fetch('/api/teachers/data/subjects', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            subjects = (Array.isArray(data) ? data : []).filter(s => {
                const level = String(s.school_level || '').toLowerCase();
                return level === 'jss' || level === 'sss' || level === 'secondary';
            });
            const select = document.getElementById('subjectSelect');
            select.innerHTML = '<option value="">Select subject</option>';
            subjects.forEach(s => {
                select.add(new Option(`${s.subject_name}${s.subject_code ? ' (' + s.subject_code + ')' : ''}`, s.subject_id));
            });
        } catch (error) { console.error('Subjects error:', error); }
    }

    async function loadAssignments() {
        const table = document.getElementById('assignmentsTable');
        try {
            const response = await fetch('/api/teachers/secondary-assignments?academic_year_id=1', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            assignments = Array.isArray(data) ? data : [];
            if (!assignments.length) {
                table.innerHTML = '<tr><td colspan="4" class="empty">No assignments found.</td></tr>';
                return;
            }
            table.innerHTML = assignments.map(a => {
                const teacherName = [a.teachers?.first_name, a.teachers?.middle_name, a.teachers?.last_name].filter(Boolean).join(' ') || '-';
                const subjectName = a.subjects?.subject_name || '-';
                const className = a.classes ? `${a.classes.class_name}${a.classes.arm ? ' ' + a.classes.arm : ''}` : '-';
                return `<tr>
                    <td>${escapeHtml(teacherName)}</td>
                    <td>${escapeHtml(subjectName)}</td>
                    <td>${escapeHtml(className)}</td>
                    <td>2026/2027</td>
                </tr>`;
            }).join('');
        } catch (error) {
            table.innerHTML = `<tr><td colspan="4" class="error">Error: ${escapeHtml(error.message)}</td></tr>`;
        }
    }

    document.getElementById('assignmentForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const teacher_id = document.getElementById('teacherSelect').value;
        const class_id = document.getElementById('classSelect').value;
        const subject_id = document.getElementById('subjectSelect').value;
        const academic_year_id = document.getElementById('yearSelect').value;

        if (!teacher_id || !class_id || !subject_id) {
            alert('Please select teacher, class, and subject.');
            return;
        }

        try {
            const response = await fetch('/api/teachers/assignments', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ teacher_id: Number(teacher_id), class_id: Number(class_id), subject_id: Number(subject_id), academic_year_id: Number(academic_year_id) })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Failed to assign');
            alert('Teacher assigned successfully!');
            this.reset();
            loadAssignments();
        } catch (error) { alert(error.message); }
    });

    loadTeachers();
    loadClasses();
    loadSubjects();
    loadAssignments();
</script>

</body>

</html>
