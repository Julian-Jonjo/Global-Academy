<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Education Academy | Teacher Assignments</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; color: #333; }
        
        /* HEADER */
        .header { background: #1a3c6e; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 38px; height: 38px; border-radius: 8px; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; }
        .header-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .header-title h1 { font-size: 16px; font-weight: 700; }
        .header-title p { font-size: 11px; color: #a0c4ff; }
        .user-info { font-size: 13px; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 6px; }

        /* MAIN */
        .container { max-width: 950px; margin: 30px auto; padding: 0 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h2 { font-size: 22px; color: #1a3c6e; }
        .back-btn { background: #6b7280; color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 600; }

        /* FORM CARD */
        .card { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .card h3 { font-size: 16px; color: #1a3c6e; margin-bottom: 16px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }

        /* FORM LAYOUT - 2 ROWS TO KEEP IT COMPACT */
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 180px; display: flex; flex-direction: column; margin-bottom: 12px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; }
        .form-group select { padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: white; transition: border-color 0.2s; }
        .form-group select:focus { outline: none; border-color: #1a3c6e; }

        /* ACTION BUTTONS */
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #f0f0f0; }
        .btn { border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: #f3f4f6; color: #374151; }
        .btn-secondary:hover { background: #e5e7eb; }
        .btn-primary { background: #1a3c6e; color: white; }
        .btn-primary:hover { background: #0f2a4a; }

        /* MESSAGE */
        .message { padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; font-size: 13px; font-weight: 500; }
        .message-success { background: #dcfce7; color: #166534; }
        .message-error { background: #fee2e2; color: #991b1b; }

        /* LOGOUT */
        .logout-bottom { position: fixed; bottom: 16px; left: 16px; background: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            .header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .user-info { text-align: left; }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <img src="/images/logo.png" alt="GEA" onerror="this.style.display='none'; this.parentElement.textContent='🏫';">
            </div>
            <div class="header-title">
                <h1>GLOBAL EDUCATION ACADEMY SECONDARY SCHOOL</h1>
                <p>Teacher Assignments</p>
            </div>
        </div>
        <div id="userInfo" class="user-info"></div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>Assign Teacher</h2>
            <button class="back-btn" onclick="window.location.href='secondary-teachers.html'">← Back</button>
        </div>

        <div class="card">
            <h3>New Assignment</h3>
            
            <div id="messageBox" class="message"></div>

            <form id="assignmentForm">
                <!-- Row 1: Teacher, Class, Type -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Teacher *</label>
                        <select id="teacherSelect" required>
                            <option value="">Select teacher</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Class *</label>
                        <select id="classSelect" required>
                            <option value="">Select class</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Assignment Type *</label>
                        <select id="assignmentTypeSelect" required>
                            <option value="subject">Subject Assignment</option>
                            <option value="master">Class Master</option>
                            <option value="hod">Head of Dept (HOD)</option>
                        </select>
                    </div>
                </div>

                <!-- Row 2: Subject, Department, Year -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Subject *</label>
                        <select id="subjectSelect" required>
                            <option value="">Select subject</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Department (HOD only)</label>
                        <select id="departmentSelect">
                            <option value="">No departments loaded</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Academic Year</label>
                        <select id="yearSelect">
                            <option value="1">2026 / 2027</option>
                        </select>
                    </div>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
                    <button type="submit" class="btn btn-primary">Assign Teacher</button>
                </div>
            </form>
        </div>
    </main>

    <button class="logout-bottom" onclick="logout()">🚪 Logout</button>

<script>
    const token = sessionStorage.getItem('authToken');
    const userData = sessionStorage.getItem('user');
    if (!token || !userData) { window.location.href = '/login.html'; }

    const user = JSON.parse(userData);
    document.getElementById('userInfo').textContent = `${user.full_name || 'User'} (${user.role_name})`;

    function logout() { sessionStorage.removeItem('authToken'); sessionStorage.removeItem('user'); window.location.href = '/login.html'; }

    let teachers = [];
    let classes = [];
    let subjects = [];
    let departments = [];

    function showMessage(message, type) {
        const box = document.getElementById('messageBox');
        box.textContent = message;
        box.className = 'message';
        box.classList.add(type === 'success' ? 'message-success' : 'message-error');
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    function resetForm() {
        document.getElementById('assignmentForm').reset();
        document.getElementById('subjectSelect').disabled = false;
        document.getElementById('departmentSelect').disabled = true;
    }

    // Handle type change (disable subject or department)
    document.getElementById('assignmentTypeSelect').addEventListener('change', function() {
        const type = this.value;
        document.getElementById('subjectSelect').disabled = type !== 'subject';
        document.getElementById('departmentSelect').disabled = type !== 'hod';
    });

    async function loadTeachers() {
        try {
            const response = await fetch('/api/teachers', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            teachers = (Array.isArray(data) ? data : []).filter(t => {
                const section = String(t.school_section || '').toLowerCase();
                return section.includes('secondary') || section.includes('jss') || section.includes('sss');
            });
            const select = document.getElementById('teacherSelect');
            select.innerHTML = '<option value="">Select teacher</option>';
            teachers.forEach(t => {
                const name = [t.first_name, t.middle_name, t.last_name].filter(Boolean).join(' ');
                select.add(new Option(`${name} (${t.staff_number})`, t.teacher_id || t.id));
            });
        } catch (error) { console.error('Teachers error:', error); }
    }

    async function loadClasses() {
        try {
            const response = await fetch('/api/classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            classes = (Array.isArray(data) ? data : []).filter(c => ['JSS', 'SSS', 'Secondary'].includes(c.school_section));
            const select = document.getElementById('classSelect');
            select.innerHTML = '<option value="">Select class</option>';
            classes.forEach(c => {
                select.add(new Option(`${c.class_name}${c.arm ? ' - ' + c.arm : ''}`, c.class_id));
            });
        } catch (error) { console.error('Classes error:', error); }
    }

    async function loadSubjects() {
        try {
            const response = await fetch('/api/teachers/data/subjects', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            subjects = (Array.isArray(data) ? data : []).filter(s => {
                const level = String(s.school_level || '').toLowerCase();
                return level === 'jss' || level === 'sss' || level === 'secondary';
            });
            const select = document.getElementById('subjectSelect');
            select.innerHTML = '<option value="">Select subject</option>';
            subjects.forEach(s => {
                select.add(new Option(`${s.subject_name}${s.subject_code ? ' (' + s.subject_code + ')' : ''}`, s.subject_id));
            });
        } catch (error) { console.error('Subjects error:', error); }
    }

    async function loadDepartments() {
    try {
        const response = await fetch('/api/teachers/data/departments', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        departments = Array.isArray(data) ? data : [];
        const select = document.getElementById('departmentSelect');
        if (departments.length === 0) {
            select.innerHTML = '<option value="">No departments loaded</option>';
        } else {
            select.innerHTML = '<option value="">Select department</option>';
            departments.forEach(d => {
                select.add(new Option(d.department_name, d.department_id));
            });
        }
    } catch (error) { console.error('Departments error:', error); }
}
    document.getElementById('assignmentForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        
        const teacher_id = document.getElementById('teacherSelect').value;
        const class_id = document.getElementById('classSelect').value;
        const subject_id = document.getElementById('subjectSelect').value;
        const assignment_type = document.getElementById('assignmentTypeSelect').value;
        const department_id = document.getElementById('departmentSelect').value;
        const academic_year_id = document.getElementById('yearSelect').value;

        if (!teacher_id) {
            showMessage('Please select a teacher.', 'error');
            return;
        }

        let url = '';
        let payload = { teacher_id: Number(teacher_id), academic_year_id: Number(academic_year_id) };

        if (assignment_type === 'subject') {
            if (!class_id || !subject_id) {
                showMessage('Please select a class and a subject.', 'error');
                return;
            }
            url = '/api/teachers/assignments';
            payload.class_id = Number(class_id);
            payload.subject_id = Number(subject_id);
        } 
        else if (assignment_type === 'master') {
            if (!class_id) {
                showMessage('Please select a class.', 'error');
                return;
            }
            url = '/api/teachers/assign-class-master';
            payload.class_id = Number(class_id);
        } 
        else if (assignment_type === 'hod') {
            if (!department_id) {
                showMessage('Please select a department.', 'error');
                return;
            }
            url = '/api/teachers/assign-department-head';
            payload.department_id = Number(department_id);
        }

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Failed to assign');
            
            showMessage('Teacher assigned successfully!', 'success');
            resetForm();
        } catch (error) {
            showMessage(error.message, 'error');
        }
    });

    // Initialize
    document.getElementById('departmentSelect').disabled = true;
    loadTeachers();
    loadClasses();
    loadSubjects();
    loadDepartments();
</script>

</body>

</html>
