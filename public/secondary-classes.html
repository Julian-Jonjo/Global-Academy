<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Education Academy Secondary School | Classes</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #222; background-image: url('/images/school-bg.jpg'); background-size: cover; background-position: center; background-attachment: fixed; position: relative; min-height: 100vh; }
        body::before { content: ''; position: fixed; inset: 0; background: rgba(255, 255, 255, 0.85); z-index: 0; }
        .header { background: #1a3c6e; color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-logo { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; }
        .header-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .header-title h1 { margin: 0; font-size: 18px; }
        .header-title p { margin: 0; font-size: 11px; color: #a0c4ff; }
        .user-info { text-align: right; font-size: 13px; color: white; }
        .container { max-width: 1400px; margin: 25px auto; padding: 0 20px 80px; position: relative; z-index: 1; }
        .page-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title h2 { margin: 0 0 6px 0; color: #1f2937; }
        .page-title p { margin: 0; color: #6b7280; }
        .back-btn { background: #6b7280; color: white; border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: bold; }
        .classes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
        .class-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); cursor: pointer; transition: all 0.3s; border-left: 4px solid #1a3c6e; }
        .class-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
        .class-card.sss { border-left-color: #7c3aed; }
        .class-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .class-arm { font-size: 13px; color: #6b7280; margin-bottom: 10px; }
        .class-section { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 10px; }
        .section-jss { background: #dbeafe; color: #1e40af; }
        .section-sss { background: #ede9fe; color: #6d28d9; }
        .class-students { font-size: 24px; font-weight: bold; color: #1a3c6e; }
        .class-students-label { font-size: 11px; color: #6b7280; text-transform: uppercase; }
        .empty { text-align: center; padding: 30px; color: #6b7280; }
        .logout-bottom { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        @media (max-width: 700px) { .header { flex-direction: column; align-items: flex-start; gap: 10px; } .classes-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <img src="/images/logo.png" alt="GEA" onerror="this.style.display='none'; this.parentElement.textContent='🏫';">
            </div>
            <div class="header-title">
                <h1>GLOBAL EDUCATION ACADEMY SECONDARY SCHOOL</h1>
                <p>Classes Management</p>
            </div>
        </div>
        <div id="userInfo" class="user-info"></div>
    </header>

    <main class="container">
        <div class="page-title">
            <div>
                <h2>Secondary School Classes</h2>
                <p>JSS and SSS classes with student counts.</p>
            </div>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
        </div>

        <div class="classes-grid" id="classesGrid">
            <div class="empty">Loading classes...</div>
        </div>
    </main>

    <button class="logout-bottom" onclick="logout()">🚪 Logout</button>

<script>
    const token = sessionStorage.getItem('authToken');
    const userData = sessionStorage.getItem('user');
    if (!token || !userData) { window.location.href = '/login.html'; }

    const user = JSON.parse(userData);
    document.getElementById('userInfo').textContent = `${user.full_name || 'User'} (${user.role_name})`;

    function logout() { sessionStorage.removeItem('authToken'); sessionStorage.removeItem('user'); window.location.href = '/login.html'; }
    function escapeHtml(value) { if (value === null || value === undefined) return ''; return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

    async function loadClasses() {
        try {
            const classesResponse = await fetch('/api/classes', {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
            });
            if (!classesResponse.ok) throw new Error('Failed to load classes');
            const classes = await classesResponse.json();

            const studentsResponse = await fetch('/api/students', {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
            });
            const students = studentsResponse.ok ? await studentsResponse.json() : [];

            const studentCounts = {};
            (students || []).forEach(student => {
                if (student.class_id) {
                    studentCounts[student.class_id] = (studentCounts[student.class_id] || 0) + 1;
                }
            });

            const grid = document.getElementById('classesGrid');
            if (!classes || classes.length === 0) {
                grid.innerHTML = '<div class="empty">No classes available.</div>';
                return;
            }

            grid.innerHTML = classes.map(cls => {
                const section = (cls.school_section || '').toLowerCase();
                const count = studentCounts[cls.class_id] || 0;
                return `
                    <div class="class-card ${section === 'sss' ? 'sss' : ''}" onclick="window.location.href='secondary-students.html?class_id=${cls.class_id}'">
                        <div class="class-name">${escapeHtml(cls.class_name || 'Unnamed Class')}</div>
                        <div class="class-arm">${cls.arm ? 'Arm: ' + escapeHtml(cls.arm) : 'No arm'}</div>
                        <span class="class-section ${section === 'jss' ? 'section-jss' : 'section-sss'}">${escapeHtml(cls.school_section || 'Unknown')}</span>
                        <div>
                            <span class="class-students">${count}</span>
                            <span class="class-students-label"> Students</span>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (error) {
            document.getElementById('classesGrid').innerHTML = `<div class="empty">Error: ${escapeHtml(error.message)}</div>`;
        }
    }

    loadClasses();
</script>

</body>

</html>
