<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Global Academy | Approvals
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f4f6f8;

            color: #222;

        }


        .header {

            background: #1f2937;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        .header h1 {

            margin: 0;

            font-size: 22px;

        }


        .user-info {

            font-size: 14px;

        }


        .container {

            max-width: 1200px;

            margin: 30px auto;

            padding: 0 20px;

        }


        .card {

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.08);

        }


        .page-title {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .page-title h2 {

            margin: 0;

        }


        .refresh-btn {

            background: #374151;

            color: white;

            border: none;

            padding: 10px 16px;

            border-radius: 6px;

            cursor: pointer;

        }


        .refresh-btn:hover {

            background: #111827;

        }


        .approval-card {

            border: 1px solid #ddd;

            border-radius: 8px;

            margin-bottom: 18px;

            overflow: hidden;

        }


        .approval-header {

            background: #f9fafb;

            padding: 15px 18px;

            border-bottom:
                1px solid #ddd;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        .student-name {

            font-size: 18px;

            font-weight: bold;

        }


        .status {

            background: #fef3c7;

            color: #92400e;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

        }


        .details {

            padding: 18px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

        }


        .detail {

            display: flex;

            flex-direction: column;

            gap: 4px;

        }


        .label {

            font-size: 12px;

            color: #6b7280;

            font-weight: bold;

            text-transform: uppercase;

        }


        .value {

            font-size: 15px;

        }


        .actions {

            padding: 15px 18px;

            border-top:
                1px solid #eee;

            display: flex;

            gap: 10px;

        }


        .btn {

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

        }


        .view-btn {

            background: #e5e7eb;

            color: #111827;

        }


        .approve-btn {

            background: #166534;

            color: white;

        }


        .reject-btn {

            background: #b91c1c;

            color: white;

        }


        .message {

            padding: 15px;

            border-radius: 6px;

            margin-bottom: 20px;

            display: none;

        }


        .success {

            background: #dcfce7;

            color: #166534;

        }


        .error {

            background: #fee2e2;

            color: #991b1b;

        }


        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #6b7280;

        }


        /* Modal */

        .modal {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(0,0,0,0.5);

            overflow-y: auto;

        }


        .modal-content {

            background: white;

            max-width: 700px;

            margin: 60px auto;

            padding: 25px;

            border-radius: 10px;

        }


        .modal-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .modal-header h2 {

            margin: 0;

        }


        .close {

            font-size: 28px;

            cursor: pointer;

            color: #666;

        }


        .modal-details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

        }


        .modal-section {

            grid-column: 1 / -1;

            margin-top: 15px;

            padding-bottom: 8px;

            border-bottom:
                1px solid #ddd;

            font-weight: bold;

        }


        .reject-area {

            display: none;

            margin-top: 15px;

        }


        .reject-area textarea {

            width: 100%;

            min-height: 100px;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            resize: vertical;

        }


        @media (max-width: 800px) {

            .details {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 600px) {

            .details,
            .modal-details {

                grid-template-columns:
                    1fr;

            }


            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 8px;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <h1>
        GLOBAL ACADEMY — Approvals
    </h1>

    <div
        class="user-info"
        id="userInfo"
    ></div>

</header>


<main class="container">


    <div class="card">


        <div class="page-title">

            <h2>
                Pending Approvals
            </h2>

            <button
                class="refresh-btn"
                onclick="loadApprovals()"
            >
                Refresh
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div id="approvalList">

            <div class="empty">

                Loading approvals...

            </div>

        </div>


    </div>


</main>


<!-- VIEW MODAL -->

<div
    id="viewModal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Student Details
            </h2>

            <span
                class="close"
                onclick="closeModal()"
            >
                &times;
            </span>

        </div>


        <div
            id="modalDetails"
            class="modal-details"
        ></div>


    </div>

</div>


<script>


const token =
    sessionStorage.getItem(
        'authToken'
    );


const userData =
    sessionStorage.getItem(
        'user'
    );


/*
 * Require login
 */

if (!token || !userData) {

    window.location.href = '/';

}


/*
 * Load user
 */

const user =
    JSON.parse(userData);


/*
 * Display user
 */

document.getElementById(
    'userInfo'
).textContent =
    `${user.full_name} (${user.role_name})`;


/*
 * Only Proprietor and
 * Administrator can access
 * approvals.
 */

if (
    user.role_name !== 'Proprietor' &&
    user.role_name !== 'Administrator'
) {

    document.body.innerHTML = `

        <h2
            style="
                text-align:center;
                margin-top:100px;
            "
        >
            You do not have permission
            to access approvals.
        </h2>

    `;

}


/*
 * Store approvals
 */

let approvals = [];


/*
 * Load approvals
 */

async function loadApprovals() {

    const list =
        document.getElementById(
            'approvalList'
        );


    list.innerHTML = `

        <div class="empty">
            Loading approvals...
        </div>

    `;


    try {

        const response =
            await fetch(
                '/api/approvals/pending',
                {
                    headers: {
                        'Authorization':
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                'Failed to load approvals'
            );

        }


        approvals = data;


        renderApprovals();


    } catch (error) {

        console.error(error);


        showMessage(
            error.message,
            'error'
        );


        list.innerHTML = `

            <div class="empty">

                Unable to load
                pending approvals.

            </div>

        `;

    }

}


/*
 * Render approval cards
 */

function renderApprovals() {

    const list =
        document.getElementById(
            'approvalList'
        );


    if (approvals.length === 0) {

        list.innerHTML = `

            <div class="empty">

                <h3>
                    No pending approvals
                </h3>

                <p>
                    There are currently
                    no student registrations
                    waiting for approval.
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML =
        approvals.map(
            approval => `

        <div
            class="approval-card"
        >

            <div class="approval-header">

                <div>

                    <div
                        class="student-name"
                    >
                        ${fullName(approval)}
                    </div>

                    <div>
                        ${escapeHtml(
                            approval.admission_number
                        )}
                    </div>

                </div>


                <span class="status">

                    Pending

                </span>

            </div>


            <div class="details">


                <div class="detail">

                    <span class="label">
                        Gender
                    </span>

                    <span class="value">

                        ${display(
                            approval.gender
                        )}

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Class
                    </span>

                    <span class="value">

                        ${
                            approval.class_name
                                ?
                                escapeHtml(
                                    approval.class_name
                                ) +
                                (
                                    approval.arm
                                        ?
                                        ' — ' +
                                        escapeHtml(
                                            approval.arm
                                        )
                                        :
                                        ''
                                )
                                :
                                'Not assigned'
                        }

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Guardian
                    </span>

                    <span class="value">

                        ${display(
                            approval.guardian_name
                        )}

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Guardian Phone
                    </span>

                    <span class="value">

                        ${display(
                            approval.guardian_phone
                        )}

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Submitted By
                    </span>

                    <span class="value">

                        ${display(
                            approval.created_by_name
                        )}

                    </span>

                </div>


                <div class="detail">

                    <span class="label">
                        Submitted
                    </span>

                    <span class="value">

                        ${formatDate(
                            approval.created_at
                        )}

                    </span>

                </div>


            </div>


            <div class="actions">


                <button
                    class="btn view-btn"
                    onclick="
                        viewStudent(
                            ${approval.approval_id}
                        )
                    "
                >
                    View
                </button>


                <button
                    class="btn approve-btn"
                    onclick="
                        approveStudent(
                            ${approval.approval_id}
                        )
                    "
                >
                    Approve
                </button>


                <button
                    class="btn reject-btn"
                    onclick="
                        rejectStudent(
                            ${approval.approval_id}
                        )
                    "
                >
                    Reject
                </button>


            </div>

        </div>

    `
        ).join('');

}


/*
 * View student
 */

function viewStudent(
    approvalId
) {

    const approval =
        approvals.find(
            item =>
                item.approval_id ===
                approvalId
        );


    if (!approval) {

        return;

    }


    document.getElementById(
        'modalDetails'
    ).innerHTML = `

        <div
            class="modal-section"
        >
            Personal Information
        </div>


        ${modalField(
            'Admission Number',
            approval.admission_number
        )}


        ${modalField(
            'First Name',
            approval.first_name
        )}


        ${modalField(
            'Middle Name',
            approval.middle_name
        )}


        ${modalField(
            'Last Name',
            approval.last_name
        )}


        ${modalField(
            'Gender',
            approval.gender
        )}


        ${modalField(
            'Date of Birth',
            approval.date_of_birth
        )}


        ${modalField(
            'Phone',
            approval.phone
        )}


        ${modalField(
            'Nationality',
            approval.nationality
        )}


        ${modalField(
            'Address',
            approval.address
        )}


        <div
            class="modal-section"
        >
            School Information
        </div>


        ${modalField(
            'Class',
            approval.class_name
                ?
                approval.class_name +
                (
                    approval.arm
                        ?
                        ' — ' +
                        approval.arm
                        :
                        ''
                )
                :
                'Not assigned'
        )}


        ${modalField(
            'Previous School',
            approval.previous_school
        )}


        ${modalField(
            'Admission Date',
            approval.admission_date
        )}


        <div
            class="modal-section"
        >
            Guardian Information
        </div>


        ${modalField(
            'Guardian',
            approval.guardian_name
        )}


        ${modalField(
            'Relationship',
            approval.guardian_relationship
        )}


        ${modalField(
            'Guardian Phone',
            approval.guardian_phone
        )}


        ${modalField(
            'Guardian Email',
            approval.guardian_email
        )}


        ${modalField(
            'Guardian Address',
            approval.guardian_address
        )}


        <div
            class="modal-section"
        >
            Emergency Contact
        </div>


        ${modalField(
            'Name',
            approval.emergency_contact_name
        )}


        ${modalField(
            'Phone',
            approval.emergency_contact_phone
        )}


        ${modalField(
            'Relationship',
            approval.emergency_contact_relationship
        )}

    `;


    document.getElementById(
        'viewModal'
    ).style.display = 'block';

}


/*
 * Approve
 */

async function approveStudent(
    approvalId
) {

    const approval =
        approvals.find(
            item =>
                item.approval_id ===
                approvalId
        );


    if (!approval) {

        return;

    }


    const confirmed =
        confirm(
            `Approve registration for ${fullName(approval)}?`
        );


    if (!confirmed) {

        return;

    }


    const notes =
        prompt(
            'Approval notes (optional):'
        );


    try {

        const response =
            await fetch(
                `/api/approvals/${approvalId}/approve`,
                {
                    method: 'POST',

                    headers: {

                        'Content-Type':
                            'application/json',

                        'Authorization':
                            `Bearer ${token}`

                    },

                    body:
                        JSON.stringify({
                            notes:
                                notes || null
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                'Approval failed'
            );

        }


        showMessage(
            'Student registration approved successfully.',
            'success'
        );


        loadApprovals();


    } catch (error) {

        console.error(error);


        showMessage(
            error.message,
            'error'
        );

    }

}


/*
 * Reject
 */

async function rejectStudent(
    approvalId
) {

    const approval =
        approvals.find(
            item =>
                item.approval_id ===
                approvalId
        );


    if (!approval) {

        return;

    }


    const reason =
        prompt(
            `Enter the reason for rejecting ${fullName(approval)}:`
        );


    if (!reason || !reason.trim()) {

        alert(
            'A rejection reason is required.'
        );

        return;

    }


    try {

        const response =
            await fetch(
                `/api/approvals/${approvalId}/reject`,
                {
                    method: 'POST',

                    headers: {

                        'Content-Type':
                            'application/json',

                        'Authorization':
                            `Bearer ${token}`

                    },

                    body:
                        JSON.stringify({
                            reason:
                                reason.trim()
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                'Rejection failed'
            );

        }


        showMessage(
            'Student registration rejected successfully.',
            'success'
        );


        loadApprovals();


    } catch (error) {

        console.error(error);


        showMessage(
            error.message,
            'error'
        );

    }

}


/*
 * Modal helpers
 */

function modalField(
    label,
    value
) {

    return `

        <div class="detail">

            <span class="label">
                ${label}
            </span>

            <span class="value">

                ${display(value)}

            </span>

        </div>

    `;

}


function closeModal() {

    document.getElementById(
        'viewModal'
    ).style.display = 'none';

}


window.onclick =
    function(event) {

        const modal =
            document.getElementById(
                'viewModal'
            );


        if (event.target === modal) {

            closeModal();

        }

    };


/*
 * Utility functions
 */

function fullName(
    student
) {

    return [
        student.first_name,
        student.middle_name,
        student.last_name
    ]
    .filter(Boolean)
    .map(escapeHtml)
    .join(' ');

}


function display(value) {

    if (
        value === null ||
        value === undefined ||
        value === ''
    ) {

        return 'Not provided';

    }


    return escapeHtml(
        String(value)
    );

}


function escapeHtml(value) {

    return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

}


function formatDate(
    value
) {

    if (!value) {

        return 'Not provided';

    }


    return new Date(value)
        .toLocaleString();

}


function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            'message'
        );


    message.textContent = text;

    message.className =
        `message ${type}`;

    message.style.display =
        'block';


    setTimeout(
        () => {

            message.style.display =
                'none';

        },
        5000
    );

}


/*
 * Initial load
 */

loadApprovals();

</script>


</body>

</html>
