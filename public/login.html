<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Education Academy | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            background-image: url('/images/school-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
            background: white;
            border: 2px solid #e5e7eb;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }

        .brand-logo .fallback-text {
            font-size: 36px;
            font-weight: bold;
            color: #1f2937;
        }

        .brand h1 {
            font-size: 22px;
            color: #1f2937;
            letter-spacing: 0.5px;
        }

        .brand .subtitle {
            color: #6b7280;
            font-size: 13px;
            margin-top: 4px;
        }

        .brand .motto {
            color: #9ca3af;
            font-size: 11px;
            margin-top: 2px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: #1f2937;
            box-shadow: 0 0 0 3px rgba(31, 41, 55, 0.1);
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1f2937;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 6px;
        }

        button:hover {
            background: #111827;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(31, 41, 55, 0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        .info {
            color: #2563eb;
        }

        .version {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #9ca3af;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }

            .brand-logo {
                width: 70px;
                height: 70px;
            }

            .brand h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- BRAND -->
            <div class="brand">

                <div class="brand-logo">

                    <img
                        src="/images/logo.png"
                        alt="Global Education Academy Logo"
                        onerror="
                            this.style.display='none';
                            this.parentElement.querySelector('.fallback-text').style.display='block';
                        "
                    >

                    <span
                        class="fallback-text"
                        style="display:none;"
                    >
                        🏫
                    </span>

                </div>

                <h1>Global Education Academy</h1>

                <p class="subtitle">
                    Management Information System
                </p>

                <p class="motto">
                    "Excellence in Education"
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button type="submit">
                    Sign In
                </button>

            </form>


            <!-- MESSAGE -->
            <div id="message"></div>


            <!-- VERSION -->
            <div class="version">
                Version 1.0 • Global Education Academy
            </div>

        </div>

    </div>


    <script>

        // ============================================================
        // LOGIN ELEMENTS
        // ============================================================

        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');


        // ============================================================
        // LOGIN
        // ============================================================

        loginForm.addEventListener('submit', async (event) => {

            event.preventDefault();


            const username =
                document.getElementById('username').value.trim();

            const password =
                document.getElementById('password').value;


            // --------------------------------------------------------
            // SHOW LOGIN STATUS
            // --------------------------------------------------------

            message.textContent = 'Signing in...';
            message.className = 'info';


            try {

                // ----------------------------------------------------
                // SEND LOGIN REQUEST
                // ----------------------------------------------------

                const response = await fetch('/api/auth/login', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })

                });


                // ----------------------------------------------------
                // READ RESPONSE
                // ----------------------------------------------------

                const data = await response.json();


                // ----------------------------------------------------
                // LOGIN FAILED
                // ----------------------------------------------------

                if (!response.ok) {

                    message.textContent =
                        data.message || 'Login failed.';

                    message.className = 'error';

                    return;
                }


                // ----------------------------------------------------
                // VALIDATE LOGIN RESPONSE
                // ----------------------------------------------------

                if (!data.token || !data.user) {

                    console.error(
                        'Invalid login response:',
                        data
                    );

                    message.textContent =
                        'Login response is incomplete.';

                    message.className = 'error';

                    return;
                }


                // ----------------------------------------------------
                // SAVE AUTHENTICATION DATA
                // ----------------------------------------------------

                sessionStorage.setItem(
                    'authToken',
                    data.token
                );

                sessionStorage.setItem(
                    'user',
                    JSON.stringify(data.user)
                );


                // ----------------------------------------------------
                // SUCCESS MESSAGE
                // ----------------------------------------------------

                message.textContent =
                    'Login successful. Redirecting...';

                message.className = 'success';


                // ----------------------------------------------------
                // REDIRECT
                // ----------------------------------------------------

                setTimeout(() => {

                    const user = data.user;


                    // =================================================
                    // IMPORTANT:
                    //
                    // role_id = WHAT THE USER IS
                    //
                    // sector = WHERE THE USER WORKS
                    //
                    // We do NOT determine the sector from role_name.
                    // =================================================

                    const roleId =
                        Number(user?.role_id);

                    const roleName =
                        String(
                            user?.role_name ||
                            user?.role ||
                            ''
                        ).trim();

                    const sector =
                        String(
                            user?.sector || ''
                        ).trim().toLowerCase();


                    // ------------------------------------------------
                    // DEBUG INFORMATION
                    // ------------------------------------------------

                    console.log(
                        'LOGIN SUCCESS - USER:',
                        {
                            role_id: roleId,
                            role_name: roleName,
                            sector: sector,
                            username: user?.username,
                            user: user
                        }
                    );


                    // =================================================
                    // ROLE 1 — PROPRIETOR
                    // =================================================

                    if (roleId === 1) {

                        console.log(
                            'Redirecting Proprietor to dashboard'
                        );

                        window.location.href =
                            '/dashboard.html';

                        return;
                    }


                    // =================================================
                    // ROLE 2 — ADMINISTRATOR
                    // =================================================

                    if (roleId === 2) {

                        console.log(
                            'Redirecting Administrator to dashboard'
                        );

                        window.location.href =
                            '/dashboard.html';

                        return;
                    }


                    // =================================================
                    // ROLE 3 — FINANCE
                    //
                    // Sector determines Finance dashboard.
                    //
                    // Primary Finance:
                    // role_id = 3
                    // sector = primary
                    //
                    // Secondary Finance:
                    // role_id = 3
                    // sector = secondary
                    // =================================================

                    if (roleId === 3) {

                        console.log(
                            'Finance login detected:',
                            {
                                role_id: roleId,
                                role_name: roleName,
                                sector: sector
                            }
                        );


                        // --------------------------------------------
                        // PRIMARY FINANCE
                        // --------------------------------------------

                        if (sector === 'primary') {

                            console.log(
                                'Redirecting to Primary Finance'
                            );

                            window.location.href =
                                '/primary-finance.html';

                            return;
                        }


                        // --------------------------------------------
                        // SECONDARY FINANCE
                        // --------------------------------------------

                        if (sector === 'secondary') {

                            console.log(
                                'Redirecting to Secondary Finance'
                            );

                            window.location.href =
                                '/secondary-finance.html';

                            return;
                        }


                        // --------------------------------------------
                        // INVALID FINANCE SECTOR
                        // --------------------------------------------

                        console.error(
                            'FINANCE USER HAS INVALID SECTOR:',
                            {
                                role_id: roleId,
                                role_name: roleName,
                                sector: sector,
                                user: user
                            }
                        );

                        alert(
                            'Your Finance account does not have a valid school sector.\n\n' +
                            'Please contact the Administrator.'
                        );

                        return;
                    }


                    // =================================================
                    // ROLE 4 — TEACHER
                    //
                    // Both Primary and Secondary Teachers use the
                    // common Teacher Dashboard.
                    //
                    // The Teacher Dashboard determines the sector.
                    // =================================================

                    if (roleId === 4) {

                        console.log(
                            'Redirecting Teacher to teachers-dashboard'
                        );

                        window.location.href =
                            '/teachers-dashboard.html';

                        return;
                    }


                    // =================================================
                    // ROLE 5 — STUDENT
                    //
                    // Both Primary and Secondary Students use the
                    // common Student Dashboard.
                    // =================================================

                    if (roleId === 5) {

                        console.log(
                            'Redirecting Student to students-dashboard'
                        );

                        window.location.href =
                            '/students-dashboard.html';

                        return;
                    }


                    // =================================================
                    // ROLE 6 — MANAGER
                    //
                    // Managers use the MAIN dashboard.
                    //
                    // dashboard.html will use the Manager's sector
                    // to determine which Primary/Secondary pages
                    // they should access.
                    // =================================================

                    if (roleId === 6) {

                        // --------------------------------------------
                        // PRIMARY MANAGER
                        // --------------------------------------------

                        if (sector === 'primary') {

                            console.log(
                                'Primary Manager → dashboard.html'
                            );

                            window.location.href =
                                '/dashboard.html';

                            return;
                        }


                        // --------------------------------------------
                        // SECONDARY MANAGER
                        // --------------------------------------------

                        if (sector === 'secondary') {

                            console.log(
                                'Secondary Manager → dashboard.html'
                            );

                            window.location.href =
                                '/dashboard.html';

                            return;
                        }


                        // --------------------------------------------
                        // INVALID MANAGER SECTOR
                        // --------------------------------------------

                        console.error(
                            'MANAGER HAS INVALID SECTOR:',
                            {
                                role_id: roleId,
                                role_name: roleName,
                                sector: sector,
                                user: user
                            }
                        );

                        alert(
                            'Your Manager account does not have a valid school sector.\n\n' +
                            'Please contact the Administrator.'
                        );

                        return;
                    }


                    // =================================================
                    // UNKNOWN ROLE
                    // =================================================

                    console.error(
                        'UNKNOWN USER ROLE:',
                        {
                            role_id: roleId,
                            role_name: roleName,
                            sector: sector,
                            user: user
                        }
                    );


                    alert(
                        'Your account has an unrecognized role.\n\n' +
                        'Please contact the Administrator.'
                    );


                }, 500);


            } catch (error) {

                // ----------------------------------------------------
                // CONNECTION ERROR
                // ----------------------------------------------------

                console.error(
                    'LOGIN ERROR:',
                    error
                );

                message.textContent =
                    'Unable to connect to the server.';

                message.className = 'error';

            }

        });

    </script>

</body>
</html>
