<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Education Academy | Login</title>

    <link rel="manifest" href="/manifest.webmanifest">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GEA Portal">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            background-image: url('/images/school-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
            background: white;
            border: 2px solid #e5e7eb;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }

        .brand-logo .fallback-text {
            font-size: 36px;
            font-weight: bold;
            color: #1f2937;
        }

        .brand h1 {
            font-size: 22px;
            color: #1f2937;
            letter-spacing: 0.5px;
        }

        .brand .subtitle {
            color: #6b7280;
            font-size: 13px;
            margin-top: 4px;
        }

        .brand .motto {
            color: #9ca3af;
            font-size: 11px;
            margin-top: 2px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: #1f2937;
            box-shadow: 0 0 0 3px rgba(31, 41, 55, 0.1);
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1f2937;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 6px;
        }

        button:hover {
            background: #111827;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(31, 41, 55, 0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        .info {
            color: #2563eb;
        }

        .version {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #9ca3af;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }

            .brand-logo {
                width: 70px;
                height: 70px;
            }

            .brand h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="brand">

                <div class="brand-logo">

                    <img
                        src="/images/logo.png"
                        alt="Global Education Academy Logo"
                        onerror="
                            this.style.display='none';
                            this.parentElement.querySelector('.fallback-text').style.display='block';
                        "
                    >

                    <span
                        class="fallback-text"
                        style="display:none;"
                    >
                        🏫
                    </span>

                </div>

                <h1>Global Education Academy</h1>

                <p class="subtitle">
                    Management Information System
                </p>

                <p class="motto">
                    "Excellence in Education"
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button type="submit">
                    Sign In
                </button>

            </form>


            <div id="message"></div>


            <div class="version">
                Version 1.0 • Global Education Academy
            </div>

        </div>

    </div>
     
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log(
                        'Service Worker registered:',
                        registration.scope
                    );
                })
                .catch(error => {
                    console.error(
                        'Service Worker registration failed:',
                        error
                    );
                });
        });
    }
   </script>

    <script>

        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');


// ============================================================
// CHECK OFFLINE SESSION
// ============================================================

function checkOfflineSession() {

    if (navigator.onLine) {
        return;
    }

    const offlineToken =
        localStorage.getItem('authToken');

    const offlineUser =
        localStorage.getItem('user');

    if (!offlineToken || !offlineUser) {
        return;
    }

    try {

        const user =
            JSON.parse(offlineUser);

        const roleId =
            Number(user?.role_id);

        const sector =
            String(
                user?.sector || ''
            ).trim().toLowerCase();

        const secondaryRoleId =
            Number(user?.secondary_role_id || 0);

        const isExamOfficer =
            user?.is_exam_officer === true;


        if (
            roleId === 1 ||
            roleId === 2 ||
            roleId === 6 ||
            roleId === 7
        ) {
            window.location.href = '/dashboard.html';
            return;
        }


        if (roleId === 3) {
            window.location.href = '/finance.html';
            return;
        }


        if (roleId === 4) {
            if (secondaryRoleId === 8 || isExamOfficer) {
                window.location.href = '/dashboard.html';
                return;
            }
            window.location.href = '/teachers-dashboard.html';
            return;
        }


        if (roleId === 5) {
            window.location.href = '/student-dashboard.html';
            return;
        }

    } catch (error) {

        console.error(
            'Invalid offline session:',
            error
        );

    }
}


checkOfflineSession();


        // ============================================================
        // LOGIN
        // ============================================================

        loginForm.addEventListener('submit', async (event) => {

            event.preventDefault();


            const username =
                document.getElementById('username').value.trim();

            const password =
                document.getElementById('password').value;


            message.textContent = 'Signing in...';
            message.className = 'info';


            try {

                const response = await fetch('/api/auth/login', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.message || 'Login failed.';

                    message.className = 'error';

                    return;
                }


                if (!data.token || !data.user) {

                    console.error(
                        'Invalid login response:',
                        data
                    );

                    message.textContent =
                        'Login response is incomplete.';

                    message.className = 'error';

                    return;
                }


                sessionStorage.setItem('authToken', data.token);
                sessionStorage.setItem('user', JSON.stringify(data.user));

                localStorage.setItem('authToken', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));


                message.textContent =
                    'Login successful. Redirecting...';

                message.className = 'success';


                setTimeout(() => {

                    const user = data.user;

                    const roleId =
                        Number(user?.role_id);

                    const roleName =
                        String(
                            user?.role_name ||
                            user?.role ||
                            ''
                        ).trim();

                    const sector =
                        String(
                            user?.sector || ''
                        ).trim().toLowerCase();

                    const secondaryRoleId =
                        Number(user?.secondary_role_id || 0);

                    const isExamOfficer =
                        user?.is_exam_officer === true;


                    console.log(
                        'LOGIN SUCCESS - USER:',
                        {
                            role_id: roleId,
                            role_name: roleName,
                            sector: sector,
                            secondary_role_id: secondaryRoleId,
                            is_exam_officer: isExamOfficer,
                            username: user?.username
                        }
                    );


                    // ------------------------------------------------
                    // ROLE 1 — PROPRIETOR
                    // ------------------------------------------------
                    if (roleId === 1) {
                        window.location.href = '/dashboard.html';
                        return;
                    }


                    // ------------------------------------------------
                    // ROLE 2 — ADMINISTRATOR
                    // ------------------------------------------------
                    if (roleId === 2) {
                        window.location.href = '/dashboard.html';
                        return;
                    }


                    // ------------------------------------------------
                    // ROLE 3 — FINANCE (sectorless)
                    // ------------------------------------------------
                    if (roleId === 3) {
                        window.location.href = '/finance.html';
                        return;
                    }


                    // ------------------------------------------------
                    // ROLE 4 — TEACHER
                    //
                    // If this teacher also holds AAO or EO role,
                    // route them to dashboard.html so they see
                    // both their teacher cards and their extra
                    // role cards.
                    // ------------------------------------------------
                    if (roleId === 4) {

                        if (secondaryRoleId === 8 || isExamOfficer) {
                            window.location.href = '/dashboard.html';
                            return;
                        }

                        window.location.href = '/teachers-dashboard.html';
                        return;
                    }


                    // ------------------------------------------------
                    // ROLE 5 — STUDENT
                    // ------------------------------------------------
                    if (roleId === 5) {
                        window.location.href = '/student-dashboard.html';
                        return;
                    }


                    // ------------------------------------------------
                    // ROLE 6 — MANAGER
                    // ------------------------------------------------
                    if (roleId === 6) {

                        if (
                            sector === 'primary' ||
                            sector === 'secondary'
                        ) {
                            window.location.href = '/dashboard.html';
                            return;
                        }

                        alert(
                            'Your Manager account does not have a valid school sector.\n\n' +
                            'Please contact the Administrator.'
                        );
                        return;
                    }


                    // ------------------------------------------------
                    // ROLE 7 — ADMIN OFFICER
                    // ------------------------------------------------
                    if (roleId === 7) {
                        window.location.href = '/dashboard.html';
                        return;
                    }


                    // ------------------------------------------------
                    // ROLE 8 / 9 — AAO / EO as PRIMARY role
                    //
                    // Only possible if you create a user with
                    // role_id 8 or 9 directly. Normally these are
                    // secondary roles on a teacher.
                    // ------------------------------------------------
                    if (roleId === 8 || roleId === 9) {
                        window.location.href = '/dashboard.html';
                        return;
                    }


                    // ------------------------------------------------
                    // UNKNOWN ROLE
                    // ------------------------------------------------
                    console.error('UNKNOWN USER ROLE:', user);

                    alert(
                        'Your account has an unrecognized role.\n\n' +
                        'Please contact the Administrator.'
                    );


                }, 500);


            } catch (error) {

                console.error(
                    'LOGIN ERROR:',
                    error
                );

                message.textContent =
                    'Unable to connect to the server.';

                message.className = 'error';

            }

        });

    </script>

</body>
</html>
