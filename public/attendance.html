<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Education Academy | Professional Attendance Register</title>

    <style>
        :root {
            --navy: #0f2a4a;
            --navy-light: #1a3c6e;
            --gold: #d4af37;
            --bg: #f4f6f9;
            --text: #1f2937;
            --light-text: #6b7280;
            --border: #e5e7eb;
            --present-bg: #dcfce7;
            --present-text: #166534;
            --absent-bg: #fee2e2;
            --absent-text: #991b1b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); }

        /* HEADER */
        .header { background: linear-gradient(135deg, var(--navy), var(--navy-light)); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-logo { width: 45px; height: 45px; border-radius: 10px; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; }
        .header-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .header-title h1 { font-size: 20px; font-weight: 700; }
        .header-title p { font-size: 12px; color: #a0c4ff; }
        .user-info { text-align: right; font-size: 14px; background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 8px; }

        /* CONTAINER */
        .container { max-width: 1600px; margin: 25px auto; padding: 0 20px 80px; }

        /* PAGE TITLE */
        .page-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title h2 { font-size: 26px; color: var(--navy); }
        .page-title p { color: var(--light-text); }
        .back-btn { background: #6b7280; color: white; border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .back-btn:hover { background: #4b5563; }

        /* BOOKSHELF */
        .sector-section { margin-bottom: 30px; }
        .sector-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 15px 20px; border-radius: 10px; }
        .sector-header.primary { background: #dcfce7; border-left: 5px solid #16a34a; }
        .sector-header.secondary { background: #dbeafe; border-left: 5px solid var(--navy-light); }
        .sector-header h3 { font-size: 18px; margin: 0; }
        .sector-count { font-size: 14px; font-weight: bold; }
        .classes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

        .book {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        .book:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .book::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 3px; background: var(--gold); }
        .book-school { font-size: 10px; text-align: center; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; margin-top: 10px; }
        .book-class { font-size: 22px; font-weight: bold; text-align: center; margin: 15px 0; }
        .book-year { font-size: 13px; text-align: center; color: var(--gold); }
        .book-master { font-size: 13px; text-align: center; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; }

        /* REGISTER VIEW */
        #register-view { display: none; background: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        .action-bar {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .action-right { display: flex; gap: 10px; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .btn-back { background: #6b7280; color: white; }
        .btn-print { background: var(--navy); color: white; }
        .btn-save { background: #16a34a; color: white; }

        .register-controls { display: flex; gap: 10px; align-items: center; }
        .register-controls select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: white;
            font-weight: bold;
        }

        /* REGISTER HEADER */
        .register-header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-bottom: 2px solid var(--gold);
        }
        .register-header h2 { font-size: 24px; color: var(--navy); margin-bottom: 8px; }
        .register-header p { font-size: 15px; color: var(--light-text); }

        /* TABLE STYLING */
        .table-wrapper { overflow-x: auto; padding: 10px; }
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th, td { border: 1px solid var(--border); padding: 6px; text-align: center; }
        thead th {
            background: var(--navy);
            color: white;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tbody tr:nth-child(even) { background: #f9fafb; }
        tbody tr:hover { background: #eff6ff; }

        .name-col { text-align: left; font-weight: 600; }

        /* ATTENDANCE CELLS */
        .day-col { width: 30px; cursor: pointer; font-weight: bold; transition: all 0.2s; border-radius: 4px; }
        .day-col.present { background-color: var(--present-bg); color: var(--present-text); }
        .day-col.absent { background-color: var(--absent-bg); color: var(--absent-text); }
        .day-col:hover { transform: scale(1.1); }

        /* SUMMARY ROWS */
        .summary-row td { background: #f1f5f9; font-weight: 700; color: var(--navy); }
        .summary-row td:nth-child(1), .summary-row td:nth-child(2) { text-align: left; }
        .total-student-row td { background: #dcfce7; font-weight: 800; color: #166534; }
        .average-row td { background: #dbeafe; font-weight: 800; color: var(--navy); }
        .percent-cell { color: #b45309; }

        @media (max-width: 900px) {
            .action-bar { flex-direction: column; align-items: flex-start; }
            .action-left, .action-right { width: 100%; justify-content: space-between; }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <img src="/images/logo.png" alt="GEA" onerror="this.style.display='none'; this.parentElement.textContent='🏫';">
            </div>
            <div class="header-title">
                <h1>GLOBAL EDUCATION ACADEMY</h1>
                <p>Professional Attendance Register</p>
            </div>
        </div>
        <div id="userInfo" class="user-info"></div>
    </header>

    <main class="container">
        <!-- BOOKSHELF VIEW -->
        <div id="bookshelf-view">
            <div class="page-title">
                <div>
                    <h2>Attendance Registers</h2>
                    <p>Select a class register to take attendance.</p>
                </div>
                <button class="back-btn" onclick="window.location.href='teachers-dashboard.html'">← Back to Dashboard</button>
            </div>

            <div class="sector-section" id="primary-section" style="display: none;">
                <div class="sector-header primary">
                    <h3>🏫 Primary School</h3>
                    <span class="sector-count" id="primaryCount">0 Classes</span>
                </div>
                <div class="classes-grid" id="primaryClasses"></div>
            </div>

            <div class="sector-section" id="secondary-section" style="display: none;">
                <div class="sector-header secondary">
                    <h3>🎓 Secondary School</h3>
                    <span class="sector-count" id="secondaryCount">0 Classes</span>
                </div>
                <div class="classes-grid" id="secondaryClasses"></div>
            </div>
        </div>

        <!-- REGISTER VIEW -->
        <div id="register-view">
            <div class="action-bar">
                <div class="action-left">
                    <button class="btn btn-back" onclick="goBackToShelf()">← Back to Bookshelf</button>
                    <div class="register-controls">
                        <select id="termSelect" onchange="rebuildRegister()">
                            <option value="1">Term 1</option>
                            <option value="2">Term 2</option>
                            <option value="3">Term 3</option>
                        </select>
                    </div>
                </div>
                <div class="action-right">
                    <button class="btn btn-print" onclick="window.print()">Print Register</button>
                    <button class="btn btn-save" onclick="saveAttendance()">Save Attendance</button>
                </div>
            </div>

            <div class="register-header">
                <h2 id="reg-title">Class Attendance Register</h2>
                <p id="reg-meta">Class Master: - | Sector: -</p>
            </div>

            <div class="table-wrapper">
                <table id="attendance-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                    <tfoot id="table-foot"></tfoot>
                </table>
            </div>
        </div>
    </main>

    <button class="logout-bottom" onclick="logout()" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">🚪 Logout</button>

<script>
    // ==========================================
    // AUTH & SESSION
    // ==========================================
    const token = sessionStorage.getItem('authToken');
    const userData = sessionStorage.getItem('user');
    if (!token || !userData) { window.location.href = '/login.html'; }

    const user = JSON.parse(userData);
    const roleId = Number(user.role_id || 0);
    const userSector = String(user.sector || '').toLowerCase();

    document.getElementById('userInfo').textContent = `${user.full_name || 'User'} (${user.role_name})`;

    function logout() { sessionStorage.removeItem('authToken'); sessionStorage.removeItem('user'); window.location.href = '/login.html'; }
    function escapeHtml(value) { if (value === null || value === undefined) return ''; return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

    // ==========================================
    // GLOBAL DATA STORES
    // ==========================================
    let teacherMap = {}; 
    let classMasterMap = {};
    let currentClassId = null;
    let currentClassInfo = null;
    let currentStudents = [];
    let allStudentsLoaded = [];
    let attendanceRecords = {};
    let currentTerm = 1;
    let currentWeekCount = 4;
    let maxWeeks = 16;
    let weekDateRanges = [];

    // ==========================================
    // CORRECT SIERRA LEONE TIMEZONE DATE HANDLING
    // ==========================================
    function toISODate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function getTodayStringSL() {
        // Use Intl.DateTimeFormat to accurately get today's date in Africa/Freetown
        const dateParts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Africa/Freetown',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }).formatToParts(new Date());

        const year = dateParts.find(part => part.type === 'year').value;
        const month = dateParts.find(part => part.type === 'month').value;
        const day = dateParts.find(part => part.type === 'day').value;

        return `${year}-${month}-${day}`;
    }

    // ==========================================
    // FETCH TEACHERS & CLASS MASTERS
    // ==========================================
    async function loadTeachers() {
        const response = await fetch('/api/teachers', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
        if (response.ok) {
            const teachers = await response.json();
            (teachers || []).forEach(t => {
                teacherMap[t.teacher_id || t.id] = `${t.first_name || ''} ${t.last_name || ''}`.trim() || 'Teacher';
            });
        }
    }

    async function loadClassMasters() {
        try {
            const primaryResp = await fetch('/api/teachers/primary-class-assignments', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (primaryResp.ok) {
                const primaryAssignments = await primaryResp.json();
                (primaryAssignments || []).forEach(assign => {
                    if (assign.role === 'Class Master' && assign.classes?.class_id) {
                        classMasterMap[assign.classes.class_id] = teacherMap[assign.teacher_id] || 'Unassigned';
                    }
                });
            }

            const secondaryResp = await fetch('/api/teachers/secondary-teachers-data', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (secondaryResp.ok) {
                const secondaryData = await secondaryResp.json();
                (secondaryData.classMasters || []).forEach(assign => {
                    if (assign.classes?.class_id) {
                        classMasterMap[assign.classes.class_id] = teacherMap[assign.teacher_id] || 'Unassigned';
                    }
                });
            }
        } catch (error) { console.error('Error loading class masters:', error); }
    }

    // ==========================================
    // LOAD BOOKSHELF
    // ==========================================
    async function loadBookshelf() {
        try {
            await loadTeachers();
            await loadClassMasters();
            let classes = [];

            if (roleId === 4) {
                const response = await fetch('/api/attendance/my-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!response.ok) throw new Error('Failed to load your classes');
                classes = await response.json();
            } 
            else if (roleId === 6) {
                const response = await fetch('/api/attendance/all-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!response.ok) throw new Error('Failed to load classes');
                const allClasses = await response.json();
                classes = allClasses.filter(c => c.school_section.toLowerCase() === userSector);
            } 
            else {
                const response = await fetch('/api/attendance/all-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!response.ok) throw new Error('Failed to load classes');
                classes = await response.json();
            }

            const primaryClasses = (classes || []).filter(c => ['Nursery', 'Primary'].includes(c.school_section));
            const secondaryClasses = (classes || []).filter(c => ['JSS', 'SSS', 'Secondary'].includes(c.school_section));

            document.getElementById('primary-section').style.display = primaryClasses.length ? 'block' : 'none';
            document.getElementById('secondary-section').style.display = secondaryClasses.length ? 'block' : 'none';

            if (primaryClasses.length) {
                document.getElementById('primaryCount').textContent = `${primaryClasses.length} Classes`;
                renderBooks('primaryClasses', primaryClasses);
            }
            if (secondaryClasses.length) {
                document.getElementById('secondaryCount').textContent = `${secondaryClasses.length} Classes`;
                renderBooks('secondaryClasses', secondaryClasses);
            }
        } catch (error) { console.error('Error:', error); }
    }

    function renderBooks(containerId, classes) {
        const container = document.getElementById(containerId);
        if (!classes || classes.length === 0) { container.innerHTML = '<div class="empty">No classes available.</div>'; return; }
        container.innerHTML = classes.map(cls => {
            let masterName = classMasterMap[cls.class_id] || 'Unassigned';
            return `
                <div class="book" onclick="openBook(${cls.class_id}, '${escapeHtml(cls.class_name || '')}${cls.arm ? ' ' + escapeHtml(cls.arm) : ''}', '${escapeHtml(cls.school_section)}')">
                    <div class="book-school">GLOBAL EDUCATION ACADEMY</div>
                    <div class="book-class">${escapeHtml(cls.class_name || 'Unnamed Class')} ${cls.arm ? escapeHtml(cls.arm) : ''}</div>
                    <div class="book-year">Academic Year: ${escapeHtml(cls.academic_year || '2026/2027')}</div>
                    <div class="book-master">Class Master:<br><b>${escapeHtml(masterName)}</b></div>
                </div>
            `;
        }).join('');
    }

    // ==========================================
    // OPEN REGISTER & GENERATE WEEKS
    // ==========================================
    async function openBook(classId, className, sector) {
        currentClassId = classId;
        currentClassInfo = { className, sector };
        currentWeekCount = 4;

        document.getElementById('bookshelf-view').style.display = 'none';
        document.getElementById('register-view').style.display = 'block';
        document.getElementById('termSelect').value = '1';

        const masterName = classMasterMap[classId] || 'Unassigned';
        document.getElementById('reg-title').innerText = className + " - Attendance Register";
        document.getElementById('reg-meta').innerText = `Class Master: ${masterName} | Sector: ${sector}`;

        try {
            allStudentsLoaded = await fetchAllStudents();
            currentStudents = allStudentsLoaded.filter(s => Number(s.class_id) === Number(classId));
            generateWeekRanges();
            renderRegisterGrid(currentStudents);
            loadSavedAttendance();
        } catch (error) {
            console.error('Error fetching students:', error);
        }
    }

    function generateWeekRanges() {
        weekDateRanges = [];
        const termStartDates = {
            1: '2026-09-07',
            2: '2027-01-11',
            3: '2027-04-19'
        };
        const startDate = new Date(termStartDates[currentTerm] + 'T00:00:00');

        for (let w = 0; w < maxWeeks; w++) {
            const weekStart = new Date(startDate);
            weekStart.setDate(startDate.getDate() + (w * 7));
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 4);

            weekDateRanges.push(toISODate(weekStart) + ' to ' + toISODate(weekEnd));
        }
    }

    function formatDisplayDate(isoDate) {
        const parts = isoDate.split('-');
        return `${parts[2]}/${parts[1]}/${parts[0].slice(2)}`;
    }

    function changeTerm() {
        currentTerm = Number(document.getElementById('termSelect').value);
        currentWeekCount = 4;
        generateWeekRanges();
        renderRegisterGrid(currentStudents);
        loadSavedAttendance();
    }

    function addWeek() {
        if (currentWeekCount >= maxWeeks) {
            alert('Maximum of 16 weeks reached!');
            return;
        }
        currentWeekCount++;
        renderRegisterGrid(currentStudents);
        loadSavedAttendance();
    }

    // ==========================================
    // RENDER REGISTER GRID
    // ==========================================
    function renderRegisterGrid(students) {
        const thead = document.getElementById('table-head');
        const tbody = document.getElementById('table-body');
        const tfoot = document.getElementById('table-foot');

        let headers = `<tr>
                            <th rowspan="2" style="width: 30px;">No.</th>
                            <th rowspan="2" style="text-align: left; width: 1%; white-space: nowrap;">NAME</th>
                            <th rowspan="2" style="width: 45px;">Prsnt</th>
                            <th rowspan="2" style="width: 45px;">Absnt</th>`;

        for (let w = 0; w < currentWeekCount; w++) {
            const displayRange = weekDateRanges[w] 
                ? `${formatDisplayDate(weekDateRanges[w].split(' to ')[0])} - ${formatDisplayDate(weekDateRanges[w].split(' to ')[1])}` 
                : '';

            headers += `<th colspan="5" class="week-header">
                            <span class="week-title" style="font-size: 13px;">Week ${w + 1}</span>
                            <span class="week-range" style="font-size: 9px; color: #a0c4ff; display: block;">${displayRange}</span>
                        </th>`;
        }
        headers += `</tr><tr>`;
        for (let w = 0; w < currentWeekCount; w++) {
            headers += `<th>M</th><th>T</th><th>W</th><th>T</th><th>F</th>`;
        }
        headers += `</tr>`;
        thead.innerHTML = headers;

        tbody.innerHTML = '';
        students.forEach((student, index) => {
            let row = `<tr>
                <td>${index + 1}</td>
                <td style="text-align: left; white-space: nowrap; padding-right: 30px;">${escapeHtml(student.first_name)} ${escapeHtml(student.last_name)}</td>
                <td class="ind-pres">-</td>
                <td class="ind-abs">-</td>`;

            for (let i = 0; i < (currentWeekCount * 5); i++) {
                row += `<td class="day-col" onclick="toggleAttendance(this)"></td>`;
            }
            row += `</tr>`;
            tbody.innerHTML += row;
        });

        let dailyB = `<tr class="summary-row"><td colspan="2">Boys Present</td><td colspan="2"></td>`;
        let dailyG = `<tr class="summary-row"><td colspan="2">Girls Present</td><td colspan="2"></td>`;
        let dailyT = `<tr class="summary-row"><td colspan="2">Total Present</td><td colspan="2"></td>`;

        let weeklyB = `<tr class="total-student-row"><td colspan="2">Week Boys</td><td colspan="2"></td>`;
        let weeklyG = `<tr class="total-student-row"><td colspan="2">Week Girls</td><td colspan="2"></td>`;
        let weeklyT = `<tr class="total-student-row"><td colspan="2">Week Total</td><td colspan="2"></td>`;

        for (let w = 0; w < currentWeekCount; w++) {
            for (let d = 0; d < 5; d++) {
                dailyB += `<td class="sum-boys-w${w}"></td>`;
                dailyG += `<td class="sum-girls-w${w}"></td>`;
                dailyT += `<td class="sum-total-w${w}"></td>`;
            }
            weeklyB += `<td colspan="5" class="week-boys-w${w}">0</td>`;
            weeklyG += `<td colspan="5" class="week-girls-w${w}">0</td>`;
            weeklyT += `<td colspan="5" class="week-total-w${w}">0</td>`;
        }

        dailyB += `</tr>`;
        dailyG += `</tr>`;
        dailyT += `</tr>`;
        weeklyB += `</tr>`;
        weeklyG += `</tr>`;
        weeklyT += `</tr>`;

        tfoot.innerHTML = dailyB + dailyG + dailyT + weeklyB + weeklyG + weeklyT;
    }

    // ==========================================
    // SAFE DATE CALCULATION
    // ==========================================
    function getDateForCell(colIndex) {
        let week = Math.floor(colIndex / 5);
        let day = colIndex % 5;
        let weekStart = weekDateRanges[week]?.split(' to ')[0];
        if (!weekStart) return null;

        let actualDate = new Date(weekStart + 'T00:00:00');
        actualDate.setDate(actualDate.getDate() + day);
        return actualDate;
    }

    // ==========================================
    // TOGGLE ATTENDANCE & LOCK DATES
    // ==========================================
    function toggleAttendance(cell) {
    // The first four cells in each student row are:
    // 0 = No.
    // 1 = Name
    // 2 = Present
    // 3 = Absent
    //
    // Therefore attendance day columns start at index 4.
    const tableColumnIndex =
        Array.from(cell.parentNode.children).indexOf(cell);

    const colIndex = tableColumnIndex - 4;

    let actualDate = getDateForCell(colIndex);

    if (!actualDate) return;

    const dateStr = toISODate(actualDate);
    const todayStr = getTodayStringSL();

    // FUTURE DATES ARE LOCKED
    if (dateStr > todayStr) {
        alert(
            '⛔ This day is in the future. Attendance can only be marked for today or past days.'
        );
        return;
    }

    if (cell.classList.contains('present')) {

        cell.classList.remove('present');
        cell.classList.add('absent');
        cell.innerText = 'X';

    } else if (cell.classList.contains('absent')) {

        cell.classList.remove('absent');
        cell.innerText = '';

    } else {

        cell.classList.add('present');
        cell.innerText = '✓';
    }

    updateTotals();
}

    function updateTotals() {
        const rows = document.querySelectorAll('#table-body tr');
        rows.forEach((row, rowIndex) => {
            const cells = row.querySelectorAll('.day-col');
            let indPresent = 0, indAbsent = 0;
            let weekBoys = Array(currentWeekCount).fill(0);
            let weekGirls = Array(currentWeekCount).fill(0);
            const gender = currentStudents[rowIndex]?.gender || '';

            cells.forEach((cell, colIndex) => {
                let week = Math.floor(colIndex / 5);
                if (cell.classList.contains('present')) {
                    indPresent++;
                    if (gender === 'Boy') weekBoys[week]++;
                    else weekGirls[week]++;
                } else if (cell.classList.contains('absent')) {
                    indAbsent++;
                }
            });

            row.querySelector('.ind-pres').innerText = indPresent;
            row.querySelector('.ind-abs').innerText = indAbsent;

            for (let w = 0; w < currentWeekCount; w++) {
                document.querySelector(`.week-boys-w${w}`).innerText = weekBoys[w];
                document.querySelector(`.week-girls-w${w}`).innerText = weekGirls[w];
                document.querySelector(`.week-total-w${w}`).innerText = weekBoys[w] + weekGirls[w];
            }
        });
    }

    // ==========================================
    // LOAD SAVED ATTENDANCE
    // ==========================================
    async function loadSavedAttendance() {
        try {
            const response = await fetch(`/api/attendance?class_id=${currentClassId}`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
            });
            const savedData = await response.json();
            attendanceRecords = {};
            (savedData || []).forEach(rec => {
                if (!attendanceRecords[rec.attendance_date]) attendanceRecords[rec.attendance_date] = {};
                attendanceRecords[rec.attendance_date][rec.student_id] = rec.status;
            });

            const rows = document.querySelectorAll('#table-body tr');
            rows.forEach((row, rowIndex) => {
                const cells = row.querySelectorAll('.day-col');
                const studentId = currentStudents[rowIndex]?.student_id;

                cells.forEach((cell, colIndex) => {
                    let actualDate = getDateForCell(colIndex);
                    if (!actualDate) return;

                    const dateStr = toISODate(actualDate);
                    const todayStr = getTodayStringSL();

                    if (dateStr > todayStr) {
                        cell.style.pointerEvents = 'none';
                        cell.style.opacity = '0.5';
                    }

                    if (attendanceRecords[dateStr]?.[studentId]) {
                        const status = attendanceRecords[dateStr][studentId];
                        if (status === 'Present') { cell.classList.add('present'); cell.innerText = '✓'; }
                        else if (status === 'Absent') { cell.classList.add('absent'); cell.innerText = 'X'; }
                    }
                });
            });
            updateTotals();
        } catch (error) { console.error('Error loading saved attendance:', error); }
    }

    // ==========================================
    // SAVE ATTENDANCE
    // ==========================================
    async function saveAttendance() {
        const records = [];
        const rows = document.querySelectorAll('#table-body tr');
        rows.forEach((row, rowIndex) => {
            const cells = row.querySelectorAll('.day-col');
            const studentId = currentStudents[rowIndex]?.student_id;
            if (!studentId) return;

            cells.forEach((cell, colIndex) => {
                let actualDate = getDateForCell(colIndex);
                if (!actualDate) return;
                const dateStr = toISODate(actualDate);
                const todayStr = getTodayStringSL();

                if (dateStr > todayStr) return;

                let status = null;
                if (cell.classList.contains('present')) status = 'Present';
                if (cell.classList.contains('absent')) status = 'Absent';

                if (status) {
                    records.push({ student_id: studentId, status, attendance_date: dateStr });
                }
            });
        });

        if (!records.length) { alert('No attendance marks to save.'); return; }

        try {
            const response = await fetch('/api/attendance/bulk', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ class_id: currentClassId, attendance_date: records[0].attendance_date, records })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Failed to save');
            alert('Attendance saved successfully.');
            loadSavedAttendance();
        } catch (error) { alert(error.message); }
    }

    // ==========================================
    // FETCH ALL STUDENTS
    // ==========================================
    async function fetchAllStudents() {
        const response = await fetch('/api/students', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
        if (!response.ok) throw new Error('Failed to load students');
        return await response.json();
    }

    function goBackToShelf() {
        document.getElementById('register-view').style.display = 'none';
        document.getElementById('bookshelf-view').style.display = 'block';
        loadBookshelf();
    }

    // ==========================================
    // INITIALIZE
    // ==========================================
    window.onload = loadBookshelf;
</script>
