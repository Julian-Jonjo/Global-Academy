<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Education Academy | Professional Attendance Register</title>

    <style>
        :root {
            --navy: #0f2a4a;
            --navy-light: #1a3c6e;
            --gold: #d4af37;
            --bg: #f4f6f9;
            --text: #1f2937;
            --light-text: #6b7280;
            --border: #e5e7eb;
            --present-bg: #dcfce7;
            --present-text: #166534;
            --absent-bg: #fee2e2;
            --absent-text: #991b1b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); }

        .header { background: linear-gradient(135deg, var(--navy), var(--navy-light)); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-logo { width: 42px; height: 42px; border-radius: 10px; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; }
        .header-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .header-title h1 { font-size: 18px; font-weight: 700; }
        .header-title p { font-size: 11px; color: #a0c4ff; }
        .user-info { text-align: right; font-size: 13px; background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 8px; }

        .container { max-width: 100%; margin: 20px auto; padding: 0 15px 60px; }

        .page-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .page-title h2 { font-size: 22px; color: var(--navy); }
        .page-title p { color: var(--light-text); font-size: 13px; }
        .back-btn { background: #6b7280; color: white; border: none; border-radius: 6px; padding: 9px 16px; cursor: pointer; font-weight: bold; }
        .back-btn:hover { background: #4b5563; }

        .sector-section { margin-bottom: 25px; }
        .sector-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 12px 18px; border-radius: 10px; }
        .sector-header.primary { background: #dcfce7; border-left: 5px solid #16a34a; }
        .sector-header.secondary { background: #dbeafe; border-left: 5px solid var(--navy-light); }
        .sector-header h3 { font-size: 16px; margin: 0; }
        .sector-count { font-size: 13px; font-weight: bold; }
        .classes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }

        .book {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        .book:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .book::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 3px; background: var(--gold); }
        .book-school { font-size: 10px; text-align: center; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; margin-bottom: 4px; }
        .book-subtitle { font-size: 11px; text-align: center; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
        .book-class { font-size: 20px; font-weight: bold; text-align: center; margin: 12px 0; }
        .book-year { font-size: 11px; text-align: center; color: #cbd5e1; margin-bottom: 4px; }
        .book-master { font-size: 11px; text-align: center; color: #cbd5e1; }

        #register-view { display: none; background: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        .action-bar {
            background: white;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .action-right { display: flex; gap: 10px; }
        .btn { padding: 9px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 13px; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-back { background: #6b7280; color: white; }
        .btn-print { background: var(--navy); color: white; }
        .btn-save { background: #16a34a; color: white; }
        .btn-nav { background: #1f2937; color: white; padding: 8px 12px; }

        .register-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .register-controls select,
        .register-controls input[type="date"] {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: white;
            font-weight: bold;
            font-family: inherit;
        }
        .week-label {
            font-size: 13px;
            font-weight: bold;
            color: var(--navy);
            padding: 7px 10px;
            background: #f3f4f6;
            border-radius: 6px;
            white-space: nowrap;
        }

        .register-header {
            text-align: center;
            padding: 14px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-bottom: 2px solid var(--gold);
        }
        .register-header h2 { font-size: 20px; color: var(--navy); margin-bottom: 6px; }
        .register-header p { font-size: 14px; color: var(--light-text); }

        .table-wrapper { overflow-x: auto; padding: 6px; }
        table { border-collapse: collapse; width: 100%; min-width: 100%; }
        th, td { border: 1px solid var(--border); padding: 4px 3px; text-align: center; font-size: 12px; overflow: hidden; }
        thead th { background: var(--navy); color: white; font-weight: bold; }
        thead th.day-header { background: var(--navy-light); }
        thead th.session-header { background: #2f5588; font-size: 11px; }
        tbody tr:nth-child(even) { background: #f9fafb; }
        tbody tr:hover { background: #eff6ff; }

        th.col-no   { width: 3%; white-space: nowrap; }
        th.col-sex  { width: 3%; white-space: nowrap; }
        th.col-ta   { width: 4%; white-space: nowrap; }
        th.col-name { width: 18%; text-align: left; }

        td.col-name {
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-left: 8px;
            padding-right: 6px;
            font-size: 12px;
        }
        td.col-sex { font-weight: bold; }
        td.col-ta  { font-weight: bold; color: var(--navy); background: #eef2ff; }

        .day-col {
            min-width: 22px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            padding: 4px 2px;
        }
        .day-col.present { background-color: var(--present-bg); color: var(--present-text); }
        .day-col.absent  { background-color: var(--absent-bg);  color: var(--absent-text); }
        .day-col:hover { background-color: #dbeafe; }

        /* Day separator — the afternoon cell of each day */
        .day-col.day-end {
            border-right: 3px solid #64748b;
        }

        /* Holiday: merged band across M and A */
        .day-col.holiday-cell {
            background-color: #f3f4f6;
            color: #1f2937;
            position: relative;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.5px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 2px 0;
            overflow: hidden;
            white-space: nowrap;
        }
        .day-col.holiday-cell::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                45deg,
                rgba(229, 231, 235, 0.6),
                rgba(229, 231, 235, 0.6) 4px,
                rgba(249, 250, 251, 0.6) 4px,
                rgba(249, 250, 251, 0.6) 8px
            );
            z-index: -1;
        }
        .day-col.holiday-cell {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            vertical-align: middle;
            text-align: center;
        }

        .week-boundary { border-right: 3px solid var(--navy) !important; }

        .summary-row td { background: #f1f5f9; font-weight: 700; color: var(--navy); font-size: 11px; }
        .summary-row td.label { text-align: right; padding-right: 6px; }
        .summary-row.present-row td { background: #eef2ff; }
        .summary-row.absent-row  td { background: #fdf2f8; }
        .summary-row.week-summary td {
            background: #e0f2fe;
            font-weight: bold;
            color: var(--navy);
            font-size: 12px;
            padding: 6px;
            text-align: center;
            white-space: nowrap;
        }

        .term-summary-block { margin: 22px 6px; }
        .term-summary-block h3 {
            font-size: 18px;
            color: var(--navy);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 3px solid var(--gold);
        }
        .term-summary-block .term-summary-line {
            background: #e0f2fe;
            border: 2px solid var(--navy);
            border-radius: 6px;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: bold;
            color: var(--navy);
            text-align: center;
        }

        .empty { text-align: center; padding: 20px; color: #6b7280; }

        @media (max-width: 900px) {
            .action-bar { flex-direction: column; align-items: flex-start; }
            .action-left, .action-right { width: 100%; justify-content: space-between; }
        }

        #print-container { display: none; }

        @media print {
            body { background: white; }
            .header, .container, .logout-bottom { display: none !important; }

            #print-container { display: block !important; }

            .print-page {
                page-break-after: always;
                padding: 10mm;
                width: 100%;
                box-sizing: border-box;
            }
            .print-page:last-child { page-break-after: auto; }

            .print-cover-page {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                text-align: center;
            }
            .cover-content { width: 100%; }
            .cover-school {
                font-size: 44px;
                color: #1a3c6e;
                margin-bottom: 20px;
                letter-spacing: 4px;
                font-weight: 800;
            }
            .cover-subtitle {
                font-size: 28px;
                color: #1a3c6e;
                margin-bottom: 80px;
                letter-spacing: 3px;
                font-weight: 700;
            }
            .cover-class {
                font-size: 36px;
                color: #000;
                margin-bottom: 40px;
                font-weight: 700;
            }
            .cover-info {
                font-size: 20px;
                color: #000;
                margin-bottom: 12px;
                font-weight: 600;
            }

            .print-reg-header {
                text-align: center;
                padding-bottom: 8px;
                border-bottom: 2px solid #000;
                margin-bottom: 6px;
            }
            .print-reg-header h1 {
                font-size: 16px;
                color: #000;
                margin-bottom: 4px;
                letter-spacing: 1px;
            }
            .print-reg-header p {
                font-size: 11px;
                color: #000;
                margin: 0;
            }

            .print-reg-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 9px;
                table-layout: auto;
            }
            .print-reg-table th,
            .print-reg-table td {
                border: 1px solid #000;
                padding: 2px 1px;
                text-align: center;
                overflow: hidden;
            }
            .print-reg-table thead th {
                background: #fff !important;
                color: #000 !important;
                font-weight: bold;
            }
            .print-reg-table thead th.day-header { background: #f0f0f0 !important; }
            .print-reg-table thead th.session-header { background: #f8f8f8 !important; }
            .print-reg-table td.col-name {
                text-align: left;
                padding-left: 4px;
                font-weight: 600;
                white-space: nowrap;
            }
            .print-reg-table td.col-ta {
                background: #f0f0f0 !important;
                color: #000 !important;
                font-weight: bold;
            }
            .print-reg-table .day-col {
                min-width: 12px;
                font-size: 10px;
                padding: 1px 0;
            }
            .print-reg-table .day-col.day-end {
                border-right: 2.5px solid #000;
            }
            .print-reg-table .day-col.present,
            .print-reg-table .day-col.absent {
                background: #fff !important;
                color: #000 !important;
            }
            .print-reg-table .day-col.holiday-cell {
                writing-mode: vertical-rl;
                text-orientation: mixed;
                font-size: 7px;
                letter-spacing: 0.3px;
            }
            .print-reg-table .day-col.holiday-cell::before {
                background: repeating-linear-gradient(
                    45deg,
                    rgba(208, 208, 208, 0.5),
                    rgba(208, 208, 208, 0.5) 2px,
                    rgba(255, 255, 255, 0.5) 2px,
                    rgba(255, 255, 255, 0.5) 4px
                );
                z-index: -1;
            }
            .print-reg-table .week-boundary {
                border-right: 3px solid #000 !important;
            }
            .print-reg-table .summary-row td {
                background: #f8f8f8 !important;
                color: #000 !important;
            }
            .print-reg-table .summary-row.week-summary td {
                background: #f0f0f0 !important;
            }

            .print-term-summary {
                margin-top: 15px;
                page-break-inside: avoid;
            }
            .print-term-summary h3 {
                font-size: 13px;
                color: #000;
                border-bottom: 3px solid #000;
                padding-bottom: 4px;
                margin-bottom: 6px;
            }
            .print-term-summary .term-summary-line {
                border: 2px solid #000;
                border-radius: 6px;
                padding: 10px;
                font-size: 12px;
                font-weight: bold;
                text-align: center;
            }

            @page { size: A3 landscape; margin: 6mm; }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <img src="/images/logo.png" alt="GEA" onerror="this.style.display='none'; this.parentElement.textContent='🏫';">
            </div>
            <div class="header-title">
                <h1>GLOBAL EDUCATION ACADEMY</h1>
                <p>Professional Attendance Register</p>
            </div>
        </div>
        <div id="userInfo" class="user-info"></div>
    </header>

    <main class="container">

        <div id="bookshelf-view">
            <div class="page-title">
                <div>
                    <h2>Attendance Registers</h2>
                    <p>Select a class register to take attendance.</p>
                </div>
                <button class="back-btn" onclick="window.location.href='teachers-dashboard.html'">← Back to Dashboard</button>
            </div>

            <div class="sector-section" id="primary-section" style="display: none;">
                <div class="sector-header primary">
                    <h3>🏫 Primary School</h3>
                    <span class="sector-count" id="primaryCount">0 Classes</span>
                </div>
                <div class="classes-grid" id="primaryClasses"></div>
            </div>

            <div class="sector-section" id="secondary-section" style="display: none;">
                <div class="sector-header secondary">
                    <h3>🎓 Secondary School</h3>
                    <span class="sector-count" id="secondaryCount">0 Classes</span>
                </div>
                <div class="classes-grid" id="secondaryClasses"></div>
            </div>
        </div>

        <div id="register-view">
            <div class="action-bar">
                <div class="action-left">
                    <button class="btn btn-back" onclick="goBackToShelf()">← Back</button>
                    <div class="register-controls">
                        <select id="termSelect" onchange="onTermChange()"></select>
                        <button class="btn btn-nav" id="prevBtn" onclick="navigateBlock(-1)">◀ 4 Weeks</button>
                        <span class="week-label" id="weekLabel">—</span>
                        <button class="btn btn-nav" id="nextBtn" onclick="navigateBlock(1)">4 Weeks ▶</button>
                        <input type="date" id="datePicker" onchange="onDatePick()">
                    </div>
                </div>
                <div class="action-right">
                    <button class="btn btn-print" onclick="printRegister()">Print Register</button>
                    <button class="btn btn-save" onclick="saveAttendance()">Save Attendance</button>
                </div>
            </div>

            <div class="register-header">
                <h2 id="reg-title">Class Attendance Register</h2>
                <p id="reg-meta">Sector: - | Term: -</p>
            </div>

            <div class="table-wrapper">
                <table id="attendance-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                    <tfoot id="table-foot"></tfoot>
                </table>
            </div>

            <div class="term-summary-block" id="term-summary-block">
                <h3>📈 Term Summary</h3>
                <div class="term-summary-line" id="term-summary-line">—</div>
            </div>
        </div>

    </main>

    <button class="logout-bottom" onclick="logout()" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">🚪 Logout</button>

    <div id="print-container"></div>

<script>
    // ==========================================
    // AUTH
    // ==========================================
    const token = sessionStorage.getItem('authToken');
    const userData = sessionStorage.getItem('user');
    if (!token || !userData) { window.location.href = '/login.html'; }

    const user = JSON.parse(userData);
    const roleId = Number(user.role_id || 0);
    const userSector = String(user.sector || '').toLowerCase();

    document.getElementById('userInfo').textContent = `${user.full_name || 'User'} (${user.role_name})`;

    function logout() { sessionStorage.removeItem('authToken'); sessionStorage.removeItem('user'); window.location.href = '/login.html'; }
    function escapeHtml(value) { if (value === null || value === undefined) return ''; return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

    // ==========================================
    // CONSTANTS
    // ==========================================
    const WEEKS_PER_BLOCK = 4;
    const MAX_WEEKS_PER_TERM = 15;
    const DAYS_PER_WEEK = 5;
    const DAYS_PER_BLOCK = WEEKS_PER_BLOCK * DAYS_PER_WEEK;
    const SESSIONS_PER_DAY = 2;

    // ==========================================
    // STATE
    // ==========================================
    let terms = [];
    let currentTerm = null;
    let blockStart = null;
    let currentClassId = null;
    let currentClassInfo = null;
    let currentStudents = [];
    let allStudentsLoaded = [];
    let attendanceRecords = {};
    let savedRecordsRaw = [];
    let termTotals = {};
    let canMark = false;
    let currentClassMasterName = '';
    let allClassesCache = [];
    let holidaySet = new Set();
    let holidayDescriptions = {};

    const DAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

    // ==========================================
    // DATE HELPERS
    // ==========================================
    function toISODate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }
    function parseISODate(str) { return new Date(str + 'T00:00:00'); }
    function getTodayStringSL() {
        const dateParts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Africa/Freetown',
            year: 'numeric', month: '2-digit', day: '2-digit'
        }).formatToParts(new Date());
        const year = dateParts.find(p => p.type === 'year').value;
        const month = dateParts.find(p => p.type === 'month').value;
        const day = dateParts.find(p => p.type === 'day').value;
        return `${year}-${month}-${day}`;
    }
    function mondayOf(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        const day = d.getDay();
        const diff = (day === 0 ? -6 : 1 - day);
        d.setDate(d.getDate() + diff);
        return d;
    }
    function addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
    }
    function formatShortDate(date) {
        return date.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit' });
    }
    function dateForIndex(i) {
        const w = Math.floor(i / DAYS_PER_WEEK);
        const d = i % DAYS_PER_WEEK;
        return addDays(blockStart, w * 7 + d);
    }
    function isMale(student) {
        const g = String(student?.gender || '').toLowerCase();
        return g === 'male' || g === 'boy' || g === 'm';
    }
    function isFemale(student) {
        const g = String(student?.gender || '').toLowerCase();
        return g === 'female' || g === 'girl' || g === 'f';
    }

    // ==========================================
    // LOAD TERMS
    // ==========================================
    async function loadTerms() {
        const response = await fetch('/api/terms', {
            headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
        });
        if (!response.ok) throw new Error('Failed to load terms');
        terms = await response.json();

        const sel = document.getElementById('termSelect');
        sel.innerHTML = '';
        terms.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.term_id;
            opt.textContent = `${t.term_name} (${t.start_date} – ${t.end_date})`;
            sel.appendChild(opt);
        });

        const today = getTodayStringSL();
        const current = terms.find(t => t.is_current)
            || terms.find(t => today >= t.start_date && today <= t.end_date)
            || terms[0];

        currentTerm = current;
        if (current) sel.value = current.term_id;
    }

    function onTermChange() {
        const id = Number(document.getElementById('termSelect').value);
        currentTerm = terms.find(t => t.term_id === id) || terms[0];

        const today = getTodayStringSL();
        let anchor;
        if (today >= currentTerm.start_date && today <= currentTerm.end_date) {
            anchor = parseISODate(today);
        } else {
            anchor = parseISODate(currentTerm.start_date);
        }
        blockStart = clampBlock(mondayOf(anchor));
        updateBlockLabel();
        renderRegisterGrid();
        loadSavedAttendance();
    }

    // ==========================================
    // BLOCK NAV
    // ==========================================
    function termStartMonday() { return mondayOf(parseISODate(currentTerm.start_date)); }
    function termEndMonday()   { return mondayOf(parseISODate(currentTerm.end_date)); }

    function clampBlock(date) {
        if (!currentTerm) return date;
        const firstMonday = termStartMonday();
        const lastMonday = termEndMonday();
        const lastValidStart = addDays(lastMonday, -(WEEKS_PER_BLOCK - 1) * 7);
        if (lastValidStart < firstMonday) return firstMonday;
        if (date < firstMonday) return firstMonday;
        if (date > lastValidStart) return lastValidStart;
        return date;
    }

    function navigateBlock(delta) {
        if (!currentTerm) return;
        const candidate = addDays(blockStart, delta * WEEKS_PER_BLOCK * 7);
        const clamped = clampBlock(candidate);
        if (toISODate(clamped) === toISODate(blockStart)) return;
        blockStart = clamped;
        updateBlockLabel();
        renderRegisterGrid();
        loadSavedAttendance();
    }

    function onDatePick() {
        const v = document.getElementById('datePicker').value;
        if (!v) return;
        blockStart = clampBlock(mondayOf(parseISODate(v)));
        updateBlockLabel();
        renderRegisterGrid();
        loadSavedAttendance();
    }

    function updateBlockLabel() {
        const start = blockStart;
        const end = addDays(start, DAYS_PER_BLOCK - 1);
        document.getElementById('weekLabel').textContent =
            `${formatShortDate(start)} – ${formatShortDate(end)}`;
        document.getElementById('datePicker').value = toISODate(start);

        const prevCandidate = clampBlock(addDays(start, -WEEKS_PER_BLOCK * 7));
        const nextCandidate = clampBlock(addDays(start, WEEKS_PER_BLOCK * 7));
        document.getElementById('prevBtn').disabled = (toISODate(prevCandidate) === toISODate(start));
        document.getElementById('nextBtn').disabled = (toISODate(nextCandidate) === toISODate(start));
    }

    // ==========================================
    // LOAD BOOKSHELF
    // ==========================================
    async function loadBookshelf() {
        try {
            let classes = [];
            if (roleId === 4) {
                const r = await fetch('/api/attendance/my-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!r.ok) throw new Error('Failed to load your classes');
                classes = await r.json();
            } else if (roleId === 6) {
                const r = await fetch('/api/attendance/all-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!r.ok) throw new Error('Failed to load classes');
                const all = await r.json();
                classes = all.filter(c => c.school_section.toLowerCase() === userSector);
            } else {
                const r = await fetch('/api/attendance/all-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!r.ok) throw new Error('Failed to load classes');
                classes = await r.json();
            }

            allClassesCache = classes;

            canMark = (roleId === 4) && Array.isArray(classes) && classes.length > 0;
            const saveBtn = document.querySelector('.btn-save');
            if (saveBtn) saveBtn.style.display = canMark ? '' : 'none';

            const primary = (classes || []).filter(c => ['Nursery', 'Primary'].includes(c.school_section));
            const secondary = (classes || []).filter(c => ['JSS', 'SSS', 'Secondary'].includes(c.school_section));

            document.getElementById('primary-section').style.display = primary.length ? 'block' : 'none';
            document.getElementById('secondary-section').style.display = secondary.length ? 'block' : 'none';

            if (primary.length) {
                document.getElementById('primaryCount').textContent = `${primary.length} Classes`;
                renderBooks('primaryClasses', primary);
            }
            if (secondary.length) {
                document.getElementById('secondaryCount').textContent = `${secondary.length} Classes`;
                renderBooks('secondaryClasses', secondary);
            }
        } catch (e) { console.error('Error:', e); }
    }

    function renderBooks(containerId, classes) {
        const container = document.getElementById(containerId);
        if (!classes || !classes.length) { container.innerHTML = '<div class="empty">No classes available.</div>'; return; }
        container.innerHTML = classes.map(cls => {
            const academicYear = cls.academic_year || '2026/2027';
            const master = cls.class_master_name || '—';

            return `
                <div class="book" onclick="openBook(${cls.class_id}, '${escapeHtml(cls.class_name || '')}${cls.arm ? ' ' + escapeHtml(cls.arm) : ''}', '${escapeHtml(cls.school_section)}')">
                    <div class="book-school">GLOBAL EDUCATION ACADEMY</div>
                    <div class="book-subtitle">CLASS ATTENDANCE REGISTER</div>
                    <div class="book-class">${escapeHtml(cls.class_name || 'Unnamed Class')} ${cls.arm ? escapeHtml(cls.arm) : ''}</div>
                    <div class="book-year">Academic Year: ${escapeHtml(academicYear)}</div>
                    <div class="book-master">Class Master: ${escapeHtml(master)}</div>
                </div>
            `;
        }).join('');
    }

    // ==========================================
    // OPEN REGISTER
    // ==========================================
    async function openBook(classId, className, sector) {
        currentClassId = classId;
        currentClassInfo = { className, sector };
        document.getElementById('bookshelf-view').style.display = 'none';
        document.getElementById('register-view').style.display = 'block';
        document.getElementById('reg-title').innerText = className + " - Attendance Register";
        document.getElementById('reg-meta').innerText = `Sector: ${sector} | Term: ${currentTerm?.term_name || '—'}`;

        const today = getTodayStringSL();
        let anchor;
        if (currentTerm && today >= currentTerm.start_date && today <= currentTerm.end_date) {
            anchor = parseISODate(today);
        } else if (currentTerm) {
            anchor = parseISODate(currentTerm.start_date);
        } else {
            anchor = new Date();
        }
        blockStart = clampBlock(mondayOf(anchor));
        updateBlockLabel();

        const cached = (allClassesCache || []).find(c => Number(c.class_id) === Number(classId));
        currentClassMasterName = cached?.class_master_name || '';

        try {
            if (!currentClassMasterName) {
                await fetchClassMasterName(classId);
            }

            await fetchHolidays();

            allStudentsLoaded = await fetchAllStudents();
            currentStudents = allStudentsLoaded.filter(s => Number(s.class_id) === Number(classId));
            renderRegisterGrid();
            await loadSavedAttendance();
        } catch (e) { console.error('Error fetching students:', e); }
    }

                const weekBoundary = isLastDay && (w < WEEKS_PER_BLOCK - 1) ? ' week-boundary' : '';

            for (let w = 0; w < WEEKS_PER_BLOCK; w++) {

                    const i = w * DAYS_PER_WEEK + d;

                    const dateStr = toISODate(date);
                    const isLastDay = (d === DAYS_PER_WEEK - 1);

        tfoot.innerHTML = rowPresent + rowAbsent + rowWeekA + rowWeekB + rowWeekC;

    // ==========================================
    // TOGGLE SESSION
    // ==========================================
    function toggleSession(cell) {
        if (!canMark) return;

        const dateIndex = Number(cell.dataset.dateIndex);
        const session = cell.dataset.session;

        const actualDate = dateForIndex(dateIndex);
        const dateStr = toISODate(actualDate);
        const todayStr = getTodayStringSL();

        if (dateStr > todayStr) {
            alert('⛔ This day is in the future. Attendance can only be marked for today or past days.');
            return;
        }

        if (holidaySet.has(dateStr)) {
            alert('🎉 This day is a holiday. Attendance cannot be marked.');
            return;
        }

        const isMorning = session === 'morning';
        const presentSymbol = isMorning ? '\\' : '/';

        if (!cell.classList.contains('present') && !cell.classList.contains('absent')) {
            cell.classList.add('present');
            cell.innerText = presentSymbol;
        } else if (cell.classList.contains('present')) {
            cell.classList.remove('present');
            cell.classList.add('absent');
            cell.innerText = 'O';
        } else {
            cell.classList.remove('absent');
            cell.innerText = '';
        }

        updateTotals();
    }

    // ==========================================
    // UPDATE TOTALS
    // ==========================================
    function updateTotals() {
        const rows = document.querySelectorAll('#table-body tr');

        const mp = Array(DAYS_PER_BLOCK).fill(0);
        const ma = Array(DAYS_PER_BLOCK).fill(0);
        const ap = Array(DAYS_PER_BLOCK).fill(0);
        const aa = Array(DAYS_PER_BLOCK).fill(0);

        const weekData = [];
        for (let w = 0; w < WEEKS_PER_BLOCK; w++) {
            weekData.push({
                mp: 0, ma: 0, ap: 0, aa: 0,
                malePresent: 0,
                femalePresent: 0
            });
        }

        rows.forEach((row, rowIndex) => {
            const student = currentStudents[rowIndex] || {};
            const male = isMale(student);

            const cells = row.querySelectorAll('.day-col');
            cells.forEach(cell => {
                const dateIndex = Number(cell.dataset.dateIndex);
                const session = cell.dataset.session;
                const w = Math.floor(dateIndex / DAYS_PER_WEEK);

                if (cell.classList.contains('present')) {
                    if (session === 'morning') { mp[dateIndex]++; weekData[w].mp++; }
                    else { ap[dateIndex]++; weekData[w].ap++; }

                    if (male) weekData[w].malePresent++;
                    else weekData[w].femalePresent++;
                } else if (cell.classList.contains('absent')) {
                    if (session === 'morning') { ma[dateIndex]++; weekData[w].ma++; }
                    else { aa[dateIndex]++; weekData[w].aa++; }
                }
            });
        });

        for (let i = 0; i < DAYS_PER_BLOCK; i++) {
            const mpCell = document.querySelector(`.ds-mp-${i}`);
            const apCell = document.querySelector(`.ds-ap-${i}`);
            const maCell = document.querySelector(`.ds-ma-${i}`);
            const aaCell = document.querySelector(`.ds-aa-${i}`);
            if (mpCell) mpCell.textContent = mp[i];
            if (apCell) apCell.textContent = ap[i];
            if (maCell) maCell.textContent = ma[i];
            if (aaCell) aaCell.textContent = aa[i];
        }

        const enrolled = currentStudents.length;
        const males = currentStudents.filter(isMale).length;
        const females = currentStudents.filter(isFemale).length;

        const termStartMon = currentTerm ? mondayOf(parseISODate(currentTerm.start_date)) : null;

        for (let w = 0; w < WEEKS_PER_BLOCK; w++) {
            const weekMon = addDays(blockStart, w * 7);

            let weekNumber = null;
            if (termStartMon) {
                const diffDays = Math.round((weekMon - termStartMon) / (1000 * 60 * 60 * 24));
                weekNumber = Math.floor(diffDays / 7) + 1;
            }
            const wk = (weekNumber && weekNumber >= 1) ? weekNumber : (w + 1);

            const d = weekData[w];
            const possibleMarks = enrolled * DAYS_PER_WEEK * SESSIONS_PER_DAY;
            const combinedPct = possibleMarks
                ? Math.round(((d.mp + d.ap) / possibleMarks) * 100)
                : 0;

            const malePossible = males * DAYS_PER_WEEK * SESSIONS_PER_DAY;
            const femalePossible = females * DAYS_PER_WEEK * SESSIONS_PER_DAY;

            const malePct = malePossible
                ? Math.round((d.malePresent / malePossible) * 100)
                : 0;
            const femalePct = femalePossible
                ? Math.round((d.femalePresent / femalePossible) * 100)
                : 0;

            const cellA = document.querySelector(`.wk-tpta-w${w}`);
            if (cellA) cellA.textContent = `Present M:${d.mp} A:${d.ap} | Absent M:${d.ma} A:${d.aa}`;

            const cellB = document.querySelector(`.wk-pct-w${w}`);
            if (cellB) cellB.textContent = `Total: ${combinedPct}% | Boys: ${malePct}% | Girls: ${femalePct}%`;

            const cellC = document.querySelector(`.wk-roll-w${w}`);
            if (cellC) cellC.textContent = `Boys: ${males} | Girls: ${females}`;
        }

        updateTermSummary();
        recomputeTA();
    }

    // ==========================================
    // TERM SUMMARY
    // ==========================================
    function updateTermSummary() {
        const enrolled = currentStudents.length;
        const males = currentStudents.filter(isMale).length;
        const females = currentStudents.filter(isFemale).length;

        let mpTotal = 0, maTotal = 0, apTotal = 0, aaTotal = 0;
        let malePresent = 0, femalePresent = 0;
        const distinctDates = new Set();

        savedRecordsRaw.forEach(rec => {
            if (!currentTerm) return;
            if (rec.attendance_date < currentTerm.start_date) return;
            if (rec.attendance_date > currentTerm.end_date) return;
            if (holidaySet.has(rec.attendance_date)) return;

            distinctDates.add(rec.attendance_date);

            const session = rec.session || 'morning';
            const student = currentStudents.find(
                s => Number(s.student_id) === Number(rec.student_id)
            );
            const male = isMale(student);

            if (rec.status === 'Present') {
                if (session === 'morning') mpTotal++; else apTotal++;
                if (male) malePresent++; else femalePresent++;
            } else if (rec.status === 'Absent') {
                if (session === 'morning') maTotal++; else aaTotal++;
            }
        });

        const marked = mpTotal + apTotal + maTotal + aaTotal;
        const combinedPct = marked
            ? Math.round(((mpTotal + apTotal) / marked) * 100)
            : 0;

        const malePct = marked && (malePresent + femalePresent)
            ? Math.round((malePresent / (malePresent + femalePresent)) * 100)
            : 0;
        const femalePct = marked && (malePresent + femalePresent)
            ? Math.round((femalePresent / (malePresent + femalePresent)) * 100)
            : 0;

        const totalAttendance = mpTotal + apTotal;
        const timesOpened = distinctDates.size;

        document.getElementById('term-summary-line').textContent =
           `Total Attendance: ${totalAttendance} | M:${mpTotal} A:${apTotal} | Average Attendance: ${combinedPct}% | Boys%: ${malePct}% | Girls%: ${femalePct}% | Times School Opened: ${timesOpened}`;
    }

    // ==========================================
    // TA
    // ==========================================
    function recomputeTA() {
        const rows = document.querySelectorAll('#table-body tr');
        rows.forEach((row, rowIndex) => {
            const studentId = currentStudents[rowIndex]?.student_id;
            if (!studentId) return;
            const ta = termTotals[studentId] || 0;
            const cell = row.querySelector('.ta-cell');
            if (cell) cell.textContent = ta;
        });
    }

    // ==========================================
    // LOAD SAVED ATTENDANCE
    // ==========================================
    async function loadSavedAttendance() {
        try {
            const response = await fetch(`/api/attendance?class_id=${currentClassId}`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
            });
            const savedData = await response.json();
            savedRecordsRaw = Array.isArray(savedData) ? savedData : [];

            attendanceRecords = {};
            termTotals = {};

            savedRecordsRaw.forEach(rec => {
                if (!attendanceRecords[rec.attendance_date]) {
                    attendanceRecords[rec.attendance_date] = {};
                }
                const session = rec.session || 'morning';
                if (!attendanceRecords[rec.attendance_date][rec.student_id]) {
                    attendanceRecords[rec.attendance_date][rec.student_id] = {};
                }
                attendanceRecords[rec.attendance_date][rec.student_id][session] = rec.status;

                if (currentTerm &&
                    rec.attendance_date >= currentTerm.start_date &&
                    rec.attendance_date <= currentTerm.end_date &&
                    rec.status === 'Present') {
                    termTotals[rec.student_id] = (termTotals[rec.student_id] || 0) + 1;
                }
            });

            const rows = document.querySelectorAll('#table-body tr');
            rows.forEach((row, rowIndex) => {
                const cells = row.querySelectorAll('.day-col');
                const studentId = currentStudents[rowIndex]?.student_id;

                cells.forEach(cell => {
                    const dateIndex = Number(cell.dataset.dateIndex);
                    const session = cell.dataset.session;

                    if (session === 'holiday') {
                        cell.style.pointerEvents = 'none';
                        cell.style.opacity = '0.5';
                        return;
                    }

                    cell.classList.remove('present', 'absent');
                    cell.innerText = '';
                    cell.removeAttribute('title');
                    cell.style.pointerEvents = '';
                    cell.style.opacity = '';

                    const dayDate = dateForIndex(dateIndex);
                    const dateStr = toISODate(dayDate);
                    const todayStr = getTodayStringSL();
                    const isHoliday = holidaySet.has(dateStr);

                    if (dateStr > todayStr) {
                        cell.style.pointerEvents = 'none';
                        cell.style.opacity = '0.5';
                    }

                    if (isHoliday) {
                        cell.style.pointerEvents = 'none';
                        cell.style.opacity = '0.5';
                        cell.setAttribute('title', holidayDescriptions[dateStr] || 'Holiday');

                        // Show the description in the left half of the merged band
                        if (session === 'morning') {
                            cell.innerText = holidayDescriptions[dateStr] || 'Holiday';
                        } else {
                            cell.innerText = '';
                        }
                    } else {
                        const rec = attendanceRecords[dateStr]?.[studentId];
                        if (rec && rec[session]) {
                            if (rec[session] === 'Present') {
                                cell.classList.add('present');
                                cell.innerText = session === 'morning' ? '\\' : '/';
                            } else if (rec[session] === 'Absent') {
                                cell.classList.add('absent');
                                cell.innerText = 'O';
                            }
                        }
                    }
                });
            });

            updateTotals();
        } catch (error) { console.error('Error loading saved attendance:', error); }
    }

    // ==========================================
    // SAVE
    // ==========================================
    async function saveAttendance() {
        if (!canMark) { alert('Only the class master can save attendance.'); return; }

        const byDateSession = {};
        const rows = document.querySelectorAll('#table-body tr');

        rows.forEach((row, rowIndex) => {
            const cells = row.querySelectorAll('.day-col');
            const studentId = currentStudents[rowIndex]?.student_id;
            if (!studentId) return;

            cells.forEach(cell => {
                const dateIndex = Number(cell.dataset.dateIndex);
                const session = cell.dataset.session;

                const dayDate = dateForIndex(dateIndex);
                const dateStr = toISODate(dayDate);
                const todayStr = getTodayStringSL();
                if (dateStr > todayStr) return;
                if (holidaySet.has(dateStr)) return;

                let status = null;
                if (cell.classList.contains('present')) status = 'Present';
                if (cell.classList.contains('absent')) status = 'Absent';
                if (!status) return;

                const key = `${dateStr}|${session}`;
                if (!byDateSession[key]) {
                    byDateSession[key] = { date: dateStr, session, records: [] };
                }
                byDateSession[key].records.push({ student_id: studentId, status });
            });
        });

        const keys = Object.keys(byDateSession);
        if (!keys.length) { alert('No attendance marks to save.'); return; }

        try {
            for (const key of keys) {
                const entry = byDateSession[key];
                const res = await fetch('/api/attendance/bulk', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        class_id: currentClassId,
                        attendance_date: entry.date,
                        session: entry.session,
                        records: entry.records
                    })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.message || 'Failed to save');
            }
            alert('Attendance saved successfully.');
            await loadSavedAttendance();
        } catch (error) { alert(error.message); }
    }

    // ==========================================
    // FETCH HOLIDAYS
    // ==========================================
    async function fetchHolidays() {
        holidaySet = new Set();
        holidayDescriptions = {};
        try {
            const r = await fetch('/api/holidays', {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
            });
            if (!r.ok) return;
            const list = await r.json();
            (list || []).forEach(h => {
                if (h.holiday_date) {
                    holidaySet.add(h.holiday_date);
                    holidayDescriptions[h.holiday_date] = h.description || 'Holiday';
                }
            });
        } catch (e) {
            console.error('Error fetching holidays:', e);
        }
    }

    // ==========================================
    // FETCH STUDENTS
    // ==========================================
    async function fetchAllStudents() {
        const r = await fetch('/api/students', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
        if (!r.ok) throw new Error('Failed to load students');
        return await r.json();
    }

    function goBackToShelf() {
        document.getElementById('register-view').style.display = 'none';
        document.getElementById('bookshelf-view').style.display = 'block';
        loadBookshelf();
    }

    // ==========================================
    // FETCH CLASS MASTER NAME (fallback)
    // ==========================================
    async function fetchClassMasterName(classId) {
        currentClassMasterName = '';
        try {
            const r = await fetch(`/api/attendance/class-master/${classId}`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
            });
            if (!r.ok) return;
            const data = await r.json();
            if (data && data.class_master_name) {
                currentClassMasterName = data.class_master_name;
            }
        } catch (e) {
            console.error('Error fetching class master:', e);
        }
    }

    // ==========================================
    // PRINT
    // ==========================================
    function printRegister() {
        const container = document.getElementById('print-container');
        container.innerHTML = '';

        const currentClass = (allClassesCache || []).find(
            c => Number(c.class_id) === Number(currentClassId)
        );
        const academicYear = currentClass?.academic_year || '2026/2027';

        const cover = document.createElement('div');
        cover.className = 'print-page print-cover-page';
        cover.innerHTML = `
            <div class="cover-content">
                <h1 class="cover-school">GLOBAL EDUCATION ACADEMY</h1>
                <h2 class="cover-subtitle">CLASS ATTENDANCE REGISTER</h2>
                <div class="cover-class">${escapeHtml(currentClassInfo?.className || '')}</div>
                <div class="cover-info">Academic Year: ${escapeHtml(String(academicYear))}</div>
                <div class="cover-info">Class Master: ${escapeHtml(currentClassMasterName || '—')}</div>
            </div>
        `;
        container.appendChild(cover);

        const termStartMon = currentTerm ? mondayOf(parseISODate(currentTerm.start_date)) : null;
        const totalWeeks = MAX_WEEKS_PER_TERM;
        const blocksCount = Math.ceil(totalWeeks / WEEKS_PER_BLOCK);

        for (let b = 0; b < blocksCount; b++) {
            const weeksInThisBlock = Math.min(
                WEEKS_PER_BLOCK,
                totalWeeks - b * WEEKS_PER_BLOCK
            );
            const pageBlockStart = addDays(termStartMon, b * WEEKS_PER_BLOCK * 7);

            const page = document.createElement('div');
            page.className = 'print-page';
            page.innerHTML = buildPrintRegisterPage(
                pageBlockStart,
                weeksInThisBlock,
                b === blocksCount - 1
            );
            container.appendChild(page);
        }

        window.print();

        setTimeout(() => { container.innerHTML = ''; }, 500);
    }

    // ==========================================
    // BUILD ONE PRINT REGISTER PAGE
    // ==========================================
    function buildPrintRegisterPage(pageBlockStart, weeksInBlock, isLastPage) {
        const termStartMon = currentTerm ? mondayOf(parseISODate(currentTerm.start_date)) : null;

        const dayDates = [];
        for (let w = 0; w < weeksInBlock; w++) {
            for (let d = 0; d < DAYS_PER_WEEK; d++) {
                dayDates.push(addDays(pageBlockStart, w * 7 + d));
            }
        }

        let html = `
            <div class="print-reg-header">
                <h1>GLOBAL EDUCATION ACADEMY</h1>
                <p>
                    Class: ${escapeHtml(currentClassInfo?.className || '—')} |
                    Sector: ${escapeHtml(currentClassInfo?.sector || '—')} |
                    Term: ${escapeHtml(currentTerm?.term_name || '—')}
                </p>
            </div>
        `;

        html += `<table class="print-reg-table"><thead>`;

        html += `<tr>
            <th rowspan="3" style="width:3%;">No.</th>
            <th rowspan="3" style="width:18%;text-align:left;">NAME</th>
            <th rowspan="3" style="width:3%;">SEX</th>
            <th rowspan="3" style="width:4%;">TA</th>`;

        for (let w = 0; w < weeksInBlock; w++) {
            const weekMon = addDays(pageBlockStart, w * 7);
            const weekFri = addDays(weekMon, 4);

            let weekNumber = null;
            if (termStartMon) {
                const diffDays = Math.round((weekMon - termStartMon) / (1000 * 60 * 60 * 24));
                weekNumber = Math.floor(diffDays / 7) + 1;
            }
            const wkLabel = weekNumber ? `Week ${weekNumber}` : `Week ${w + 1}`;
            const boundaryClass = (w < weeksInBlock - 1) ? ' week-boundary' : '';

            html += `<th colspan="10" class="day-header${boundaryClass}">
                <div style="font-size: 10px;">${wkLabel}</div>
                <div style="font-size: 8px;">${formatShortDate(weekMon)} – ${formatShortDate(weekFri)}</div>
            </th>`;
        }
        html += `</tr>`;

        html += `<tr>`;
        for (let w = 0; w < weeksInBlock; w++) {
            for (let d = 0; d < DAYS_PER_WEEK; d++) {
                const idx = w * DAYS_PER_WEEK + d;
                const date = dayDates[idx];
                const boundaryClass = (d === DAYS_PER_WEEK - 1 && w < weeksInBlock - 1) ? ' week-boundary' : '';
                html += `<th colspan="2" class="day-header${boundaryClass}">
                    <div style="font-size: 9px;">${DAY_LABELS[d]}</div>
                    <div style="font-size: 8px;">${formatShortDate(date)}</div>
                </th>`;
            }
        }
        html += `</tr>`;

        html += `<tr>`;
        for (let w = 0; w < weeksInBlock; w++) {
            for (let d = 0; d < DAYS_PER_WEEK; d++) {
                const isLastDay = (d === DAYS_PER_WEEK - 1);
                const dayEndClass = isLastDay ? ' day-end' : '';
                const weekBoundary = isLastDay && (w < weeksInBlock - 1) ? ' week-boundary' : '';
                html += `<th class="session-header">M</th>`;
                html += `<th class="session-header${dayEndClass}${weekBoundary}">A</th>`;
            }
        }
        html += `</tr></thead>`;

        html += `<tbody>`;
        currentStudents.forEach((student, index) => {
            const sex = isMale(student) ? 'M' : (isFemale(student) ? 'F' : '—');
            const ta = termTotals[student.student_id] || 0;

            html += `<tr>
                <td>${index + 1}</td>
                <td class="col-name">${escapeHtml(student.first_name)} ${escapeHtml(student.last_name)}</td>
                <td>${sex}</td>
                <td class="col-ta">${ta}</td>`;

            for (let w = 0; w < weeksInBlock; w++) {
                for (let d = 0; d < DAYS_PER_WEEK; d++) {
                    const date = addDays(pageBlockStart, w * 7 + d);
                    const dateStr = toISODate(date);
                    const isLastDay = (d === DAYS_PER_WEEK - 1);
                    const dayEndClass = isLastDay ? ' day-end' : '';
                    const weekBoundary = isLastDay && (w < weeksInBlock - 1) ? ' week-boundary' : '';

                    const isHoliday = holidaySet.has(dateStr);
                    const rec = attendanceRecords[dateStr]?.[student.student_id] || {};

                    if (isHoliday) {
                        if (index === 0) {
                            const desc = escapeHtml(holidayDescriptions[dateStr] || 'Holiday');
                            html += `<td class="day-col holiday-cell${dayEndClass}${weekBoundary}" colspan="2" rowspan="${currentStudents.length}">${desc}</td>`;
                        }
                    } else {
                        let morningMark = '';
                        let afternoonMark = '';
                        if (rec.morning === 'Present') morningMark = '\\';
                        else if (rec.morning === 'Absent') morningMark = 'O';
                        if (rec.afternoon === 'Present') afternoonMark = '/';
                        else if (rec.afternoon === 'Absent') afternoonMark = 'O';

                        html += `<td class="day-col">${morningMark}</td>`;
                        html += `<td class="day-col${dayEndClass}${weekBoundary}">${afternoonMark}</td>`;
                    }
                }
            }
            html += `</tr>`;
        });
        html += `</tbody>`;

        html += `<tfoot>`;

        html += `<tr class="summary-row present-row"><td colspan="4" class="label">PRESENT M/A</td>`;
        for (let w = 0; w < weeksInBlock; w++) {
            for (let d = 0; d < DAYS_PER_WEEK; d++) {
                const date = addDays(pageBlockStart, w * 7 + d);
                const dateStr = toISODate(date);
                const isLastDay = (d === DAYS_PER_WEEK - 1) && (w < weeksInBlock - 1);
                const isHoliday = holidaySet.has(dateStr);

                let mpCount = 0, apCount = 0;
                if (!isHoliday) {
                    currentStudents.forEach(s => {
                        const rec = attendanceRecords[dateStr]?.[s.student_id];
                        if (rec?.morning === 'Present') mpCount++;
                        if (rec?.afternoon === 'Present') apCount++;
                    });
                }

                html += `<td>${mpCount}</td><td class="${isLastDay ? 'week-boundary' : ''}">${apCount}</td>`;
            }
        }
        html += `</tr>`;

        html += `<tr class="summary-row absent-row"><td colspan="4" class="label">ABSENT M/A</td>`;
        for (let w = 0; w < weeksInBlock; w++) {
            for (let d = 0; d < DAYS_PER_WEEK; d++) {
                const date = addDays(pageBlockStart, w * 7 + d);
                const dateStr = toISODate(date);
                const isLastDay = (d === DAYS_PER_WEEK - 1) && (w < weeksInBlock - 1);
                const isHoliday = holidaySet.has(dateStr);

                let maCount = 0, aaCount = 0;
                if (!isHoliday) {
                    currentStudents.forEach(s => {
                        const rec = attendanceRecords[dateStr]?.[s.student_id];
                        if (rec?.morning === 'Absent') maCount++;
                        if (rec?.afternoon === 'Absent') aaCount++;
                    });
                }

                html += `<td>${maCount}</td><td class="${isLastDay ? 'week-boundary' : ''}">${aaCount}</td>`;
            }
        }
        html += `</tr>`;

        html += `<tr class="summary-row week-summary"><td colspan="4" class="label">WEEK TOTALS</td>`;
        for (let w = 0; w < weeksInBlock; w++) {
            const weekMon = addDays(pageBlockStart, w * 7);

            let weekNumber = null;
            if (termStartMon) {
                const diffDays = Math.round((weekMon - termStartMon) / (1000 * 60 * 60 * 24));
                weekNumber = Math.floor(diffDays / 7) + 1;
            }
            const wk = weekNumber || (w + 1);

            let tpM = 0, tpA = 0, taM = 0, taA = 0;
            for (let d = 0; d < DAYS_PER_WEEK; d++) {
                const date = addDays(weekMon, d);
                const dateStr = toISODate(date);
                if (holidaySet.has(dateStr)) continue;

                currentStudents.forEach(s => {
                    const rec = attendanceRecords[dateStr]?.[s.student_id];
                    if (rec?.morning === 'Present') tpM++;
                    if (rec?.afternoon === 'Present') tpA++;
                    if (rec?.morning === 'Absent') taM++;
                    if (rec?.afternoon === 'Absent') taA++;
                });
            }

            const boundaryClass = (w < weeksInBlock - 1) ? ' week-boundary' : '';
            html += `<td colspan="10" class="${boundaryClass}">Wk ${wk} | Present M:${tpM} A:${tpA} | Absent M:${taM} A:${taA}</td>`;
        }
        html += `</tr>`;

        html += `<tr class="summary-row week-summary"><td colspan="4" class="label">WEEK PERCENTAGES</td>`;
        for (let w = 0; w < weeksInBlock; w++) {
            const weekMon = addDays(pageBlockStart, w * 7);
            const enrolled = currentStudents.length;
            const males = currentStudents.filter(isMale).length;
            const females = currentStudents.filter(isFemale).length;

            const possible = enrolled * DAYS_PER_WEEK * SESSIONS_PER_DAY;
            const malePossible = males * DAYS_PER_WEEK * SESSIONS_PER_DAY;
            const femalePossible = females * DAYS_PER_WEEK * SESSIONS_PER_DAY;

            let tp = 0, malePresent = 0, femalePresent = 0;
            for (let d = 0; d < DAYS_PER_WEEK; d++) {
                const date = addDays(weekMon, d);
                const dateStr = toISODate(date);
                if (holidaySet.has(dateStr)) continue;

                currentStudents.forEach(s => {
                    const rec = attendanceRecords[dateStr]?.[s.student_id];
                    if (rec?.morning === 'Present') tp++;
                    if (rec?.afternoon === 'Present') tp++;

                    const presentCount =
                        (rec?.morning === 'Present' ? 1 : 0) +
                        (rec?.afternoon === 'Present' ? 1 : 0);
                    if (presentCount > 0) {
                        if (isMale(s)) malePresent += presentCount;
                        else femalePresent += presentCount;
                    }
                });
            }

            const combPct = possible ? Math.round((tp / possible) * 100) : 0;
            const malePct = malePossible ? Math.round((malePresent / malePossible) * 100) : 0;
            const femalePct = femalePossible ? Math.round((femalePresent / femalePossible) * 100) : 0;

            const boundaryClass = (w < weeksInBlock - 1) ? ' week-boundary' : '';
            html += `<td colspan="10" class="${boundaryClass}">Total: ${combPct}% | Boys: ${malePct}% | Girls: ${femalePct}%</td>`;
        }
        html += `</tr>`;

        html += `<tr class="summary-row week-summary"><td colspan="4" class="label">ON ROLL</td>`;
        const malesCount = currentStudents.filter(isMale).length;
        const femalesCount = currentStudents.filter(isFemale).length;
        for (let w = 0; w < weeksInBlock; w++) {
            const boundaryClass = (w < weeksInBlock - 1) ? ' week-boundary' : '';
            html += `<td colspan="10" class="${boundaryClass}">Boys: ${malesCount} | Girls: ${femalesCount}</td>`;
        }
        html += `</tr>`;

        html += `</tfoot></table>`;

        if (isLastPage) {
            html += `
                <div class="print-term-summary">
                    <h3>Term Summary</h3>
                    <div class="term-summary-line">${escapeHtml(document.getElementById('term-summary-line').textContent)}</div>
                </div>
            `;
        }

        return html;
    }

    // ==========================================
    // INIT
    // ==========================================
    window.onload = async function() {
        try { await loadTerms(); } catch (e) { console.error('Failed to load terms:', e); }
        loadBookshelf();
    };
</script>
