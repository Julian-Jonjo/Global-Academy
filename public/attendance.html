<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Education Academy | Professional Attendance Register</title>

    <style>
        :root {
            --navy: #0f2a4a;
            --navy-light: #1a3c6e;
            --gold: #d4af37;
            --bg: #f4f6f9;
            --text: #1f2937;
            --light-text: #6b7280;
            --border: #e5e7eb;
            --present-bg: #dcfce7;
            --present-text: #166534;
            --absent-bg: #fee2e2;
            --absent-text: #991b1b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); }

        .header { background: linear-gradient(135deg, var(--navy), var(--navy-light)); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-logo { width: 45px; height: 45px; border-radius: 10px; overflow: hidden; background: white; display: flex; align-items: center; justify-content: center; }
        .header-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .header-title h1 { font-size: 20px; font-weight: 700; }
        .header-title p { font-size: 12px; color: #a0c4ff; }
        .user-info { text-align: right; font-size: 14px; background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 8px; }

        .container { max-width: 100%; margin: 25px auto; padding: 0 20px 80px; }

        .page-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title h2 { font-size: 26px; color: var(--navy); }
        .page-title p { color: var(--light-text); }
        .back-btn { background: #6b7280; color: white; border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .back-btn:hover { background: #4b5563; }

        .sector-section { margin-bottom: 30px; }
        .sector-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 15px 20px; border-radius: 10px; }
        .sector-header.primary { background: #dcfce7; border-left: 5px solid #16a34a; }
        .sector-header.secondary { background: #dbeafe; border-left: 5px solid var(--navy-light); }
        .sector-header h3 { font-size: 18px; margin: 0; }
        .sector-count { font-size: 14px; font-weight: bold; }
        .classes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

        .book {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        .book:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .book::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 3px; background: var(--gold); }
        .book-school { font-size: 10px; text-align: center; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; margin-top: 10px; }
        .book-class { font-size: 22px; font-weight: bold; text-align: center; margin: 15px 0; }
        .book-year { font-size: 13px; text-align: center; color: var(--gold); }

        #register-view { display: none; background: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        .action-bar {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .action-right { display: flex; gap: 10px; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-back { background: #6b7280; color: white; }
        .btn-print { background: var(--navy); color: white; }
        .btn-save { background: #16a34a; color: white; }
        .btn-nav { background: #1f2937; color: white; padding: 8px 14px; }

        .register-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .register-controls select,
        .register-controls input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: white;
            font-weight: bold;
            font-family: inherit;
        }
        .week-label {
            font-size: 14px;
            font-weight: bold;
            color: var(--navy);
            padding: 8px 10px;
            background: #f3f4f6;
            border-radius: 6px;
            white-space: nowrap;
        }

        .register-header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-bottom: 2px solid var(--gold);
        }
        .register-header h2 { font-size: 24px; color: var(--navy); margin-bottom: 8px; }
        .register-header p { font-size: 15px; color: var(--light-text); }

        .table-wrapper { overflow-x: auto; padding: 10px; }
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th, td { border: 1px solid var(--border); padding: 6px; text-align: center; }
        thead th {
            background: var(--navy);
            color: white;
            font-weight: bold;
        }
        tbody tr:nth-child(even) { background: #f9fafb; }
        tbody tr:hover { background: #eff6ff; }

        .day-col { width: 40px; cursor: pointer; font-weight: bold; transition: all 0.2s; border-radius: 4px; }
        .day-col.present { background-color: var(--present-bg); color: var(--present-text); }
        .day-col.absent { background-color: var(--absent-bg); color: var(--absent-text); }
        .day-col:hover { transform: scale(1.05); }

        .summary-row td { background: #f1f5f9; font-weight: 700; color: var(--navy); }
        .summary-row td.label { text-align: right; }

        .day-summary-cell {
            font-size: 9px;
            line-height: 1.25;
            padding: 3px 1px;
            white-space: nowrap;
        }
        .day-summary-cell .line1 { font-weight: bold; }
        .day-summary-cell .line2 { font-weight: bold; color: #0f2a4a; }

        .summary-block { margin: 25px 10px; }
        .summary-block h3 {
            font-size: 16px;
            color: var(--navy);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--gold);
        }
        .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .summary-table th {
            background: var(--navy);
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 12px;
        }
        .summary-table td {
            padding: 7px 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .summary-table td.label-col { text-align: left; font-weight: bold; background: #f9fafb; }
        .summary-table tr:hover td { background: #f3f4f6; }
        .summary-table .male-col { background: #eef2ff; }
        .summary-table .female-col { background: #fdf2f8; }
        .summary-table .total-col { background: #f0fdf4; font-weight: bold; }
        .summary-table .absent-col { background: #fef2f2; font-weight: bold; }
        .empty { text-align: center; padding: 20px; color: #6b7280; }

        @media (max-width: 900px) {
            .action-bar { flex-direction: column; align-items: flex-start; }
            .action-left, .action-right { width: 100%; justify-content: space-between; }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <img src="/images/logo.png" alt="GEA" onerror="this.style.display='none'; this.parentElement.textContent='🏫';">
            </div>
            <div class="header-title">
                <h1>GLOBAL EDUCATION ACADEMY</h1>
                <p>Professional Attendance Register</p>
            </div>
        </div>
        <div id="userInfo" class="user-info"></div>
    </header>

    <main class="container">
        <!-- BOOKSHELF VIEW -->
        <div id="bookshelf-view">
            <div class="page-title">
                <div>
                    <h2>Attendance Registers</h2>
                    <p>Select a class register to take attendance.</p>
                </div>
                <button class="back-btn" onclick="window.location.href='teachers-dashboard.html'">← Back to Dashboard</button>
            </div>

            <div class="sector-section" id="primary-section" style="display: none;">
                <div class="sector-header primary">
                    <h3>🏫 Primary School</h3>
                    <span class="sector-count" id="primaryCount">0 Classes</span>
                </div>
                <div class="classes-grid" id="primaryClasses"></div>
            </div>

            <div class="sector-section" id="secondary-section" style="display: none;">
                <div class="sector-header secondary">
                    <h3>🎓 Secondary School</h3>
                    <span class="sector-count" id="secondaryCount">0 Classes</span>
                </div>
                <div class="classes-grid" id="secondaryClasses"></div>
            </div>
        </div>

        <!-- REGISTER VIEW -->
        <div id="register-view">
            <div class="action-bar">
                <div class="action-left">
                    <button class="btn btn-back" onclick="goBackToShelf()">← Back to Bookshelf</button>

                    <div class="register-controls">
                        <select id="termSelect" onchange="onTermChange()"></select>
                        <button class="btn btn-nav" id="prevBtn" onclick="navigateBlock(-1)">◀ 4 Weeks</button>
                        <span class="week-label" id="weekLabel">—</span>
                        <button class="btn btn-nav" id="nextBtn" onclick="navigateBlock(1)">4 Weeks ▶</button>
                        <input type="date" id="datePicker" onchange="onDatePick()">
                    </div>
                </div>
                <div class="action-right">
                    <button class="btn btn-print" onclick="window.print()">Print Register</button>
                    <button class="btn btn-save" onclick="saveAttendance()">Save Attendance</button>
                </div>
            </div>

            <div class="register-header">
                <h2 id="reg-title">Class Attendance Register</h2>
                <p id="reg-meta">Sector: -</p>
            </div>

            <div class="table-wrapper">
                <table id="attendance-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                    <tfoot id="table-foot"></tfoot>
                </table>
            </div>

            <!-- SUMMARY BLOCKS -->
            <div class="summary-block" id="term-summary-block">
                <h3>📆 Term Totals</h3>
                <div id="term-summary"></div>
            </div>

            <div class="summary-block" id="yearly-summary-block">
                <h3>🗓️ Yearly Totals</h3>
                <div id="yearly-summary"></div>
            </div>
        </div>
    </main>

    <button class="logout-bottom" onclick="logout()" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">🚪 Logout</button>

<script>
    // ==========================================
    // AUTH & SESSION
    // ==========================================
    const token = sessionStorage.getItem('authToken');
    const userData = sessionStorage.getItem('user');
    if (!token || !userData) { window.location.href = '/login.html'; }

    const user = JSON.parse(userData);
    const roleId = Number(user.role_id || 0);
    const userSector = String(user.sector || '').toLowerCase();

    document.getElementById('userInfo').textContent = `${user.full_name || 'User'} (${user.role_name})`;

    function logout() { sessionStorage.removeItem('authToken'); sessionStorage.removeItem('user'); window.location.href = '/login.html'; }
    function escapeHtml(value) { if (value === null || value === undefined) return ''; return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

    // ==========================================
    // CONSTANTS
    // ==========================================
    const WEEKS_PER_BLOCK = 4;
    const DAYS_PER_WEEK = 5;
    const DAYS_PER_BLOCK = WEEKS_PER_BLOCK * DAYS_PER_WEEK;   // 20

    // ==========================================
    // GLOBAL STATE
    // ==========================================
    let terms = [];
    let currentTerm = null;
    let blockStart = null;              // Monday of the first visible week

    let currentClassId = null;
    let currentClassInfo = null;
    let currentStudents = [];
    let allStudentsLoaded = [];
    let attendanceRecords = {};
    let savedRecordsRaw = [];

    let canMark = false;

    const DAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

    // ==========================================
    // DATE HELPERS
    // ==========================================
    function toISODate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function parseISODate(str) {
        return new Date(str + 'T00:00:00');
    }

    function getTodayStringSL() {
        const dateParts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Africa/Freetown',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }).formatToParts(new Date());
        const year = dateParts.find(p => p.type === 'year').value;
        const month = dateParts.find(p => p.type === 'month').value;
        const day = dateParts.find(p => p.type === 'day').value;
        return `${year}-${month}-${day}`;
    }

    function mondayOf(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        const day = d.getDay();
        const diff = (day === 0 ? -6 : 1 - day);
        d.setDate(d.getDate() + diff);
        return d;
    }

    function addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
    }

    function formatLongDate(date) {
        return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function formatShortDate(date) {
        return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function isMale(student) {
        const g = String(student?.gender || '').toLowerCase();
        return g === 'male' || g === 'boy' || g === 'm';
    }

    function isFemale(student) {
        const g = String(student?.gender || '').toLowerCase();
        return g === 'female' || g === 'girl' || g === 'f';
    }

    // ==========================================
    // LOAD TERMS
    // ==========================================
    async function loadTerms() {
        const response = await fetch('/api/terms', {
            headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
        });
        if (!response.ok) throw new Error('Failed to load terms');
        terms = await response.json();

        const sel = document.getElementById('termSelect');
        sel.innerHTML = '';
        terms.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.term_id;
            opt.textContent = `${t.term_name} (${t.start_date} – ${t.end_date})`;
            sel.appendChild(opt);
        });

        const today = getTodayStringSL();
        const current = terms.find(t => t.is_current)
            || terms.find(t => today >= t.start_date && today <= t.end_date)
            || terms[0];

        currentTerm = current;
        if (current) sel.value = current.term_id;
    }

    function onTermChange() {
        const id = Number(document.getElementById('termSelect').value);
        currentTerm = terms.find(t => t.term_id === id) || terms[0];

        const today = getTodayStringSL();
        let anchor;
        if (today >= currentTerm.start_date && today <= currentTerm.end_date) {
            anchor = parseISODate(today);
        } else {
            anchor = parseISODate(currentTerm.start_date);
        }
        blockStart = clampBlock(mondayOf(anchor));
        updateBlockLabel();
        renderRegisterGrid();
        loadSavedAttendance();
    }

    // ==========================================
    // BLOCK NAVIGATION (4 weeks = 1 block)
    // ==========================================
    function termStartMonday() {
        return mondayOf(parseISODate(currentTerm.start_date));
    }

    function termEndMonday() {
        // Last Monday whose week overlaps the term end
        const end = parseISODate(currentTerm.end_date);
        return mondayOf(end);
    }

    function clampBlock(date) {
        if (!currentTerm) return date;
        const firstMonday = termStartMonday();
        const lastMonday = termEndMonday();

        // Effective range for the block's first week: [firstMonday, lastMonday - (WEEKS_PER_BLOCK-1)*7]
        const lastValidStart = addDays(lastMonday, -(WEEKS_PER_BLOCK - 1) * 7);
        if (lastValidStart < firstMonday) {
            // Term shorter than 4 weeks: always start at firstMonday
            return firstMonday;
        }
        if (date < firstMonday) return firstMonday;
        if (date > lastValidStart) return lastValidStart;
        return date;
    }

    function navigateBlock(delta) {
        if (!currentTerm) return;
        const candidate = addDays(blockStart, delta * WEEKS_PER_BLOCK * 7);
        const clamped = clampBlock(candidate);
        if (toISODate(clamped) === toISODate(blockStart)) return;
        blockStart = clamped;
        updateBlockLabel();
        renderRegisterGrid();
        loadSavedAttendance();
    }

    function onDatePick() {
        const v = document.getElementById('datePicker').value;
        if (!v) return;
        const monday = mondayOf(parseISODate(v));
        blockStart = clampBlock(monday);
        updateBlockLabel();
        renderRegisterGrid();
        loadSavedAttendance();
    }

    function updateBlockLabel() {
        const start = blockStart;
        const end = addDays(start, DAYS_PER_BLOCK - 1);
        document.getElementById('weekLabel').textContent =
            `${formatShortDate(start)} – ${formatShortDate(end)}`;
        document.getElementById('datePicker').value = toISODate(start);

        const prevCandidate = clampBlock(addDays(start, -WEEKS_PER_BLOCK * 7));
        const nextCandidate = clampBlock(addDays(start, WEEKS_PER_BLOCK * 7));
        document.getElementById('prevBtn').disabled = (toISODate(prevCandidate) === toISODate(start));
        document.getElementById('nextBtn').disabled = (toISODate(nextCandidate) === toISODate(start));
    }

    // ==========================================
    // LOAD BOOKSHELF
    // ==========================================
    async function loadBookshelf() {
        try {
            let classes = [];

            if (roleId === 4) {
                const response = await fetch('/api/attendance/my-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!response.ok) throw new Error('Failed to load your classes');
                classes = await response.json();
            }
            else if (roleId === 6) {
                const response = await fetch('/api/attendance/all-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!response.ok) throw new Error('Failed to load classes');
                const allClasses = await response.json();
                classes = allClasses.filter(c => c.school_section.toLowerCase() === userSector);
            }
            else {
                const response = await fetch('/api/attendance/all-classes', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
                if (!response.ok) throw new Error('Failed to load classes');
                classes = await response.json();
            }

            canMark = (roleId === 4) && Array.isArray(classes) && classes.length > 0;

            const saveBtn = document.querySelector('.btn-save');
            if (saveBtn) saveBtn.style.display = canMark ? '' : 'none';

            const primaryClasses = (classes || []).filter(c => ['Nursery', 'Primary'].includes(c.school_section));
            const secondaryClasses = (classes || []).filter(c => ['JSS', 'SSS', 'Secondary'].includes(c.school_section));

            document.getElementById('primary-section').style.display = primaryClasses.length ? 'block' : 'none';
            document.getElementById('secondary-section').style.display = secondaryClasses.length ? 'block' : 'none';

            if (primaryClasses.length) {
                document.getElementById('primaryCount').textContent = `${primaryClasses.length} Classes`;
                renderBooks('primaryClasses', primaryClasses);
            }
            if (secondaryClasses.length) {
                document.getElementById('secondaryCount').textContent = `${secondaryClasses.length} Classes`;
                renderBooks('secondaryClasses', secondaryClasses);
            }
        } catch (error) { console.error('Error:', error); }
    }

    function renderBooks(containerId, classes) {
        const container = document.getElementById(containerId);
        if (!classes || classes.length === 0) { container.innerHTML = '<div class="empty">No classes available.</div>'; return; }
        container.innerHTML = classes.map(cls => {
            return `
                <div class="book" onclick="openBook(${cls.class_id}, '${escapeHtml(cls.class_name || '')}${cls.arm ? ' ' + escapeHtml(cls.arm) : ''}', '${escapeHtml(cls.school_section)}')">
                    <div class="book-school">GLOBAL EDUCATION ACADEMY</div>
                    <div class="book-class">${escapeHtml(cls.class_name || 'Unnamed Class')} ${cls.arm ? escapeHtml(cls.arm) : ''}</div>
                    <div class="book-year">Academic Year: ${escapeHtml(cls.academic_year || '2026/2027')}</div>
                </div>
            `;
        }).join('');
    }

    // ==========================================
    // OPEN REGISTER
    // ==========================================
    async function openBook(classId, className, sector) {
        currentClassId = classId;
        currentClassInfo = { className, sector };

        document.getElementById('bookshelf-view').style.display = 'none';
        document.getElementById('register-view').style.display = 'block';

        document.getElementById('reg-title').innerText = className + " - Attendance Register";
        document.getElementById('reg-meta').innerText = `Sector: ${sector}`;

        const today = getTodayStringSL();
        let anchor;
        if (currentTerm && today >= currentTerm.start_date && today <= currentTerm.end_date) {
            anchor = parseISODate(today);
        } else if (currentTerm) {
            anchor = parseISODate(currentTerm.start_date);
        } else {
            anchor = new Date();
        }
        blockStart = clampBlock(mondayOf(anchor));
        updateBlockLabel();

        try {
            allStudentsLoaded = await fetchAllStudents();
            currentStudents = allStudentsLoaded.filter(s => Number(s.class_id) === Number(classId));
            renderRegisterGrid();
            await loadSavedAttendance();
        } catch (error) {
            console.error('Error fetching students:', error);
        }
    }

    // ==========================================
    // RENDER REGISTER GRID (4 WEEKS)
    // ==========================================
    function renderRegisterGrid() {
        const thead = document.getElementById('table-head');
        const tbody = document.getElementById('table-body');
        const tfoot = document.getElementById('table-foot');

        // Build the 20 day-dates
        const dayDates = [];
        for (let i = 0; i < DAYS_PER_BLOCK; i++) dayDates.push(addDays(blockStart, i));

        // ---- Header row 1: week header spanning 5 columns each ----
        let headerRow1 = `<tr>
            <th rowspan="2" style="width: 30px;">No.</th>
            <th rowspan="2" style="text-align: left; white-space: nowrap;">NAME</th>
            <th rowspan="2" style="width: 45px;">Prsnt</th>
            <th rowspan="2" style="width: 45px;">Absnt</th>`;

         const termStartMon = currentTerm ? mondayOf(parseISODate(currentTerm.start_date)) : null;

        for (let w = 0; w < WEEKS_PER_BLOCK; w++) {
            const weekMon = addDays(blockStart, w * 7);
            const weekFri = addDays(weekMon, 4);

            let weekNumber = null;
            if (termStartMon) {
                const diffDays = Math.round((weekMon - termStartMon) / (1000 * 60 * 60 * 24));
                weekNumber = Math.floor(diffDays / 7) + 1;
            }

            const weekLabel = weekNumber && weekNumber >= 1
                ? `Week ${weekNumber}`
                : `Week ${w + 1}`;

            headerRow1 += `<th colspan="5" style="background:#1a3c6e;">
                <div style="font-size: 12px;">${weekLabel}</div>
                <div style="font-size: 9px; color: #a0c4ff;">${formatShortDate(weekMon)} – ${formatShortDate(weekFri)}</div>
            </th>`;
        }
        headerRow1 += `</tr>`;

        // ---- Header row 2: day labels ----
        let headerRow2 = `<tr>`;
        for (let w = 0; w < WEEKS_PER_BLOCK; w++) {
            for (let d = 0; d < DAYS_PER_WEEK; d++) {
                const idx = w * DAYS_PER_WEEK + d;
                const date = dayDates[idx];
                headerRow2 += `<th style="width: 40px;">
                    <div style="font-size: 11px;">${DAY_LABELS[d]}</div>
                    <div style="font-size: 9px; color: #a0c4ff;">${date.getDate()}/${date.getMonth() + 1}</div>
                </th>`;
            }
        }
        headerRow2 += `</tr>`;

        thead.innerHTML = headerRow1 + headerRow2;

        // ---- Student rows ----
        tbody.innerHTML = '';
        currentStudents.forEach((student, index) => {
            let row = `<tr>
                <td>${index + 1}</td>
                <td style="text-align: left; white-space: nowrap; padding-right: 20px;">${escapeHtml(student.first_name)} ${escapeHtml(student.last_name)}</td>
                <td class="ind-pres">-</td>
                <td class="ind-abs">-</td>`;

            for (let i = 0; i < DAYS_PER_BLOCK; i++) {
                row += canMark
                    ? `<td class="day-col" onclick="toggleAttendance(this)"></td>`
                    : `<td class="day-col" style="cursor: default;"></td>`;
            }
            row += `</tr>`;
            tbody.innerHTML += row;
        });

        // ---- tfoot: one dense summary cell per day ----
        let tfootHtml = `<tr class="summary-row">
            <td colspan="4" class="label" style="text-align:right;">Daily Summary</td>`;

        for (let i = 0; i < DAYS_PER_BLOCK; i++) {
            tfootHtml += `<td class="day-summary-cell">
                <div class="line1"><span class="ds-mp">M:0/0</span> <span class="ds-fp">F:0/0</span></div>
                <div class="line2">T:0/0</div>
            </td>`;
        }
        tfootHtml += `</tr>`;
        tfoot.innerHTML = tfootHtml;
    }

    // ==========================================
    // TOGGLE
    // ==========================================
    function toggleAttendance(cell) {
        if (!canMark) return;

        const tableColumnIndex = Array.from(cell.parentNode.children).indexOf(cell);
        const colIndex = tableColumnIndex - 4;   // first 4 columns: No, Name, Prsnt, Absnt
        if (colIndex < 0 || colIndex >= DAYS_PER_BLOCK) return;

        const actualDate = addDays(blockStart, colIndex);
        const dateStr = toISODate(actualDate);
        const todayStr = getTodayStringSL();

        if (dateStr > todayStr) {
            alert('⛔ This day is in the future. Attendance can only be marked for today or past days.');
            return;
        }

        if (cell.classList.contains('present')) {
            cell.classList.remove('present');
            cell.classList.add('absent');
            cell.innerText = 'X';
        } else if (cell.classList.contains('absent')) {
            cell.classList.remove('absent');
            cell.innerText = '';
        } else {
            cell.classList.add('present');
            cell.innerText = '✓';
        }

        updateTotals();
    }

    // ==========================================
    // UPDATE TOTALS
    // ==========================================
    function updateTotals() {
        const rows = document.querySelectorAll('#table-body tr');

        // Per-row present/absent
        rows.forEach(row => {
            const cells = row.querySelectorAll('.day-col');
            let indPresent = 0, indAbsent = 0;
            cells.forEach(cell => {
                if (cell.classList.contains('present')) indPresent++;
                else if (cell.classList.contains('absent')) indAbsent++;
            });
            row.querySelector('.ind-pres').innerText = indPresent;
            row.querySelector('.ind-abs').innerText = indAbsent;
        });

        // Per-day totals across all 20 columns
        const dayTotals = [];
        for (let i = 0; i < DAYS_PER_BLOCK; i++) {
            dayTotals.push({ malePresent: 0, maleAbsent: 0, femalePresent: 0, femaleAbsent: 0, totalPresent: 0, totalAbsent: 0 });
        }

        rows.forEach((row, rowIndex) => {
            const cells = row.querySelectorAll('.day-col');
            const student = currentStudents[rowIndex] || {};
            const male = isMale(student);

            cells.forEach((cell, colIndex) => {
                if (colIndex < 0 || colIndex >= DAYS_PER_BLOCK) return;
                if (cell.classList.contains('present')) {
                    dayTotals[colIndex].totalPresent++;
                    if (male) dayTotals[colIndex].malePresent++; else dayTotals[colIndex].femalePresent++;
                } else if (cell.classList.contains('absent')) {
                    dayTotals[colIndex].totalAbsent++;
                    if (male) dayTotals[colIndex].maleAbsent++; else dayTotals[colIndex].femaleAbsent++;
                }
            });
        });

        const summaryCells = document.querySelectorAll('#table-foot .day-summary-cell');
        summaryCells.forEach((td, i) => {
            const t = dayTotals[i];
            if (!t) return;
            td.querySelector('.ds-mp').textContent = `M:${t.malePresent}/${t.maleAbsent}`;
            td.querySelector('.ds-fp').textContent = `F:${t.femalePresent}/${t.femaleAbsent}`;
            td.querySelector('.line2').textContent = `T:${t.totalPresent}/${t.totalAbsent}`;
        });

        recomputeSummaryBlocks();
    }

    // ==========================================
    // LOAD SAVED ATTENDANCE
    // ==========================================
    async function loadSavedAttendance() {
        try {
            const response = await fetch(`/api/attendance?class_id=${currentClassId}`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
            });
            const savedData = await response.json();
            savedRecordsRaw = Array.isArray(savedData) ? savedData : [];

            attendanceRecords = {};
            savedRecordsRaw.forEach(rec => {
                if (!attendanceRecords[rec.attendance_date]) attendanceRecords[rec.attendance_date] = {};
                attendanceRecords[rec.attendance_date][rec.student_id] = rec.status;
            });

            const rows = document.querySelectorAll('#table-body tr');
            rows.forEach((row, rowIndex) => {
                const cells = row.querySelectorAll('.day-col');
                const studentId = currentStudents[rowIndex]?.student_id;

                cells.forEach((cell, colIndex) => {
                    cell.classList.remove('present', 'absent');
                    cell.innerText = '';
                    cell.style.pointerEvents = '';
                    cell.style.opacity = '';

                    const dayDate = addDays(blockStart, colIndex);
                    const dateStr = toISODate(dayDate);
                    const todayStr = getTodayStringSL();

                    if (dateStr > todayStr) {
                        cell.style.pointerEvents = 'none';
                        cell.style.opacity = '0.5';
                    }

                    if (attendanceRecords[dateStr]?.[studentId]) {
                        const status = attendanceRecords[dateStr][studentId];
                        if (status === 'Present') { cell.classList.add('present'); cell.innerText = '✓'; }
                        else if (status === 'Absent') { cell.classList.add('absent'); cell.innerText = 'X'; }
                    }
                });
            });
            updateTotals();
        } catch (error) { console.error('Error loading saved attendance:', error); }
    }

    // ==========================================
    // SAVE ATTENDANCE
    // ==========================================
    async function saveAttendance() {
        if (!canMark) { alert('Only the class master can save attendance.'); return; }

        const byDate = {};
        const rows = document.querySelectorAll('#table-body tr');
        rows.forEach((row, rowIndex) => {
            const cells = row.querySelectorAll('.day-col');
            const studentId = currentStudents[rowIndex]?.student_id;
            if (!studentId) return;

            cells.forEach((cell, colIndex) => {
                const dayDate = addDays(blockStart, colIndex);
                const dateStr = toISODate(dayDate);
                const todayStr = getTodayStringSL();
                if (dateStr > todayStr) return;

                let status = null;
                if (cell.classList.contains('present')) status = 'Present';
                if (cell.classList.contains('absent')) status = 'Absent';
                if (!status) return;

                if (!byDate[dateStr]) byDate[dateStr] = [];
                byDate[dateStr].push({ student_id: studentId, status });
            });
        });

        const dates = Object.keys(byDate);
        if (!dates.length) { alert('No attendance marks to save.'); return; }

        try {
            for (const dateStr of dates) {
                const response = await fetch('/api/attendance/bulk', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        class_id: currentClassId,
                        attendance_date: dateStr,
                        records: byDate[dateStr]
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || 'Failed to save');
            }
            alert('Attendance saved successfully.');
            await loadSavedAttendance();
        } catch (error) { alert(error.message); }
    }

    // ==========================================
    // FETCH STUDENTS
    // ==========================================
    async function fetchAllStudents() {
        const response = await fetch('/api/students', { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
        if (!response.ok) throw new Error('Failed to load students');
        return await response.json();
    }

    // ==========================================
    // TERM & YEARLY SUMMARY
    // ==========================================
    function aggregateRange(startDate, endDate) {
        const totals = { malePresent: 0, maleAbsent: 0, femalePresent: 0, femaleAbsent: 0, totalPresent: 0, totalAbsent: 0 };
        const studentById = new Map();
        currentStudents.forEach(s => studentById.set(Number(s.student_id), s));

        savedRecordsRaw.forEach(rec => {
            if (!rec.attendance_date) return;
            if (startDate && rec.attendance_date < startDate) return;
            if (endDate && rec.attendance_date > endDate) return;

            const student = studentById.get(Number(rec.student_id));
            if (!student) return;

            const male = isMale(student);

            if (rec.status === 'Present') {
                totals.totalPresent++;
                if (male) totals.malePresent++; else totals.femalePresent++;
            } else if (rec.status === 'Absent') {
                totals.totalAbsent++;
                if (male) totals.maleAbsent++; else totals.femaleAbsent++;
            }
        });

        return totals;
    }

    function renderSummaryTable(rows) {
        if (!rows.length) return '<div class="empty">No records.</div>';
        let html = `<table class="summary-table">
            <thead>
                <tr>
                    <th style="text-align:left;">Period</th>
                    <th>Male Present</th>
                    <th>Male Absent</th>
                    <th>Female Present</th>
                    <th>Female Absent</th>
                    <th>Total Present</th>
                    <th>Total Absent</th>
                </tr>
            </thead>
            <tbody>`;
        rows.forEach(r => {
            html += `<tr>
                <td class="label-col">${escapeHtml(r.label)}</td>
                <td class="male-col">${r.malePresent}</td>
                <td class="male-col">${r.maleAbsent}</td>
                <td class="female-col">${r.femalePresent}</td>
                <td class="female-col">${r.femaleAbsent}</td>
                <td class="total-col">${r.totalPresent}</td>
                <td class="absent-col">${r.totalAbsent}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        return html;
    }

    function recomputeSummaryBlocks() {
        const termRows = terms.map(t => {
            const totals = aggregateRange(t.start_date, t.end_date);
            return { label: `${t.term_name} (${t.start_date} – ${t.end_date})`, ...totals };
        });

        document.getElementById('term-summary').innerHTML = renderSummaryTable(termRows);

        const yearly = { malePresent: 0, maleAbsent: 0, femalePresent: 0, femaleAbsent: 0, totalPresent: 0, totalAbsent: 0 };
        savedRecordsRaw.forEach(rec => {
            const student = currentStudents.find(s => Number(s.student_id) === Number(rec.student_id));
            if (!student) return;
            const male = isMale(student);
            if (rec.status === 'Present') {
                yearly.totalPresent++;
                if (male) yearly.malePresent++; else yearly.femalePresent++;
            } else if (rec.status === 'Absent') {
                yearly.totalAbsent++;
                if (male) yearly.maleAbsent++; else yearly.femaleAbsent++;
            }
        });

        document.getElementById('yearly-summary').innerHTML = renderSummaryTable([
            { label: 'All Terms', ...yearly }
        ]);
    }

    // ==========================================
    // BACK
    // ==========================================
    function goBackToShelf() {
        document.getElementById('register-view').style.display = 'none';
        document.getElementById('bookshelf-view').style.display = 'block';
        loadBookshelf();
    }

    // ==========================================
    // INIT
    // ==========================================
    window.onload = async function() {
        try {
            await loadTerms();
        } catch (error) {
            console.error('Failed to load terms:', error);
        }
        loadBookshelf();
    };
</script>
