    <script>
    // =========================================================
    // AUTHENTICATION & ROLE - DECLARED ONCE
    // =========================================================

    const token = sessionStorage.getItem('authToken');
    const userData = sessionStorage.getItem('user');

    if (!token || !userData) {
        window.location.href = '/login.html';
    }

    let user;
    try {
        user = JSON.parse(userData);
    } catch (error) {
        sessionStorage.removeItem('authToken');
        sessionStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    // =========================================================
    // ROLE VARIABLES - DECLARED ONCE
    // =========================================================
    const role = user.role_name || user.role || '';
    const userRole = (user.role_name || user.role || '').toLowerCase();

    // =========================================================
    // SECONDARY FINANCE ACCESS CONTROL
    // =========================================================
    // Database roles:
    // - "Finance Officer (Secondary)"  --> Access granted
    // - "Manager-Secondary"            --> Access granted
    // - "Manager" (general)            --> Access granted
    // - "Proprietor"                   --> Access granted
    // - "Administrator"                --> Access granted
    
    const isFinanceOfficer = 
        role === 'Finance Officer (Secondary)' ||
        role === 'Finance Officer' ||
        role.toLowerCase() === 'finance officer' ||
        role.toLowerCase().includes('finance');

    const isManager = 
        role === 'Manager-Secondary' ||
        role === 'Manager' ||
        userRole === 'manager-secondary' ||
        userRole === 'manager';

    const isProprietor = 
        role === 'Proprietor' ||
        userRole === 'proprietor';

    const isAdmin = 
        role === 'Administrator' ||
        userRole === 'administrator' ||
        userRole === 'admin';

    const canEdit = isFinanceOfficer || isManager || isProprietor || isAdmin;
    const canApprove = isManager || isProprietor || isAdmin;

    // Check if user has access to Secondary Finance
    const isAllowed = isFinanceOfficer || isManager || isProprietor || isAdmin;

    if (!isAllowed) {
        alert('You do not have permission to access Secondary School Finance.');
        window.location.href = 'dashboard.html';
    }

    // =========================================================
    // NO SECTOR CHECK - The role name already tells us the sector
    // =========================================================

    // =========================================================
    // DISPLAY USER INFO
    // =========================================================
    document.getElementById('userRole').textContent = role || 'Finance Officer';
    document.getElementById('userRoleLabel').textContent = 'Secondary School Finance';

    // Show role badge
    const badgeContainer = document.getElementById('roleBadgeContainer');
    let badgeClass = 'viewer';
    let badgeText = 'View-Only Access';
    if (isProprietor) { badgeClass = 'proprietor'; badgeText = '👑 Proprietor'; }
    else if (isAdmin) { badgeClass = 'admin'; badgeText = '⚙️ Admin'; }
    else if (isManager) { badgeClass = 'manager'; badgeText = '📋 Manager'; }
    else if (isFinanceOfficer) { badgeClass = 'finance'; badgeText = '💰 Finance Officer'; }

    badgeContainer.innerHTML = `<span class="role-badge ${badgeClass}">${badgeText}</span>`;

    // =========================================================

    // loadStudents, loadPayments, loadExpenditure, loadApprovals,
    // submitPayment, submitExpenditure, etc.)
    // =========================================================

    // ... your existing functions ...
    </script>
</body>
</html>
