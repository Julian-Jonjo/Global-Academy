<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Academy | Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn {
            background: #1f2937;
            color: white;
        }

        .submit-btn:hover {
            background: #111827;
        }

        .back-btn {
            background: #ddd;
        }

        .back-btn:hover {
            background: #ccc;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            display: none;
            border-radius: 6px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>GLOBAL ACADEMY — Student Registration</h1>
</header>


<main class="container">

    <div class="card">

        <h2>Register New Student</h2>

        <p>
            Complete the student's information below.
            The registration will be submitted for approval.
        </p>


        <form id="studentForm">

            <!-- PERSONAL INFORMATION -->

            <h3 class="section-title">
                Personal Information
            </h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="admission_number">
                        Admission Number *
                    </label>

                    <input
                        type="text"
                        id="admission_number"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="first_name">
                        First Name *
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="middle_name">
                        Middle Name
                    </label>

                    <input
                        type="text"
                        id="middle_name"
                    >
                </div>


                <div class="form-group">
                    <label for="last_name">
                        Last Name *
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender">

                        <option value="">
                            Select gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="date_of_birth">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="date_of_birth"
                    >
                </div>


                <div class="form-group">
                    <label for="nationality">
                        Nationality
                    </label>

                    <input
                        type="text"
                        id="nationality"
                        value="Sierra Leonean"
                    >
                </div>


                <div class="form-group">
                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                    >
                </div>


                <div class="form-group full-width">
                    <label for="address">
                        Address
                    </label>

                    <textarea id="address"></textarea>
                </div>

            </div>


            <!-- SCHOOL INFORMATION -->

            <h3 class="section-title">
                School Information
            </h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="class_id">
                        Class *
                    </label>

                    <select id="class_id" required>

                        <option value="">
                            Loading classes...
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="admission_date">
                        Admission Date
                    </label>

                    <input
                        type="date"
                        id="admission_date"
                    >
                </div>


                <div class="form-group">
                    <label for="previous_school">
                        Previous School
                    </label>

                    <input
                        type="text"
                        id="previous_school"
                    >
                </div>

            </div>


            <!-- GUARDIAN INFORMATION -->

            <h3 class="section-title">
                Guardian Information
            </h3>

            <div class="form-grid">

                <div class="form-group full-width">

                    <label for="guardian_id">
                        Guardian
                    </label>

                    <select id="guardian_id">

                        <option value="">
                            Loading guardians...
                        </option>

                    </select>

                </div>

            </div>


            <!-- EMERGENCY CONTACT -->

            <h3 class="section-title">
                Emergency Contact
            </h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="emergency_contact_name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="emergency_contact_name"
                    >
                </div>


                <div class="form-group">
                    <label for="emergency_contact_phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="emergency_contact_phone"
                    >
                </div>


                <div class="form-group">
                    <label for="emergency_contact_relationship">
                        Relationship
                    </label>

                    <input
                        type="text"
                        id="emergency_contact_relationship"
                    >
                </div>

            </div>


            <!-- MESSAGE -->

            <div id="message"></div>


            <!-- BUTTONS -->

            <div class="actions">

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Registration
                </button>


                <button
                    type="button"
                    class="back-btn"
                    onclick="history.back()"
                >
                    Cancel
                </button>

            </div>

        </form>

    </div>

</main>


<script>

    /*
     * ==========================================
     * AUTHENTICATION
     * ==========================================
     */

    const token =
        sessionStorage.getItem('authToken');

    const userData =
        sessionStorage.getItem('user');


    /*
     * Require login
     */

    if (!token || !userData) {

        window.location.href = '/';

    }


    /*
     * Get logged-in user
     */

    let user;

    try {

        user = JSON.parse(userData);

    } catch (error) {

        sessionStorage.removeItem('authToken');
        sessionStorage.removeItem('user');

        window.location.href = '/';

    }


    /*
     * Only Manager and Administrator
     * can register students.
     */

    if (
        user.role_name !== 'Manager' &&
        user.role_name !== 'Administrator'
    ) {

        document.body.innerHTML =
            `
            <div style="
                text-align:center;
                margin-top:100px;
                font-family:Arial;
            ">
                <h2>Access Denied</h2>
                <p>
                    You do not have permission
                    to register students.
                </p>
            </div>
            `;

    }


    /*
     * ==========================================
     * FORM ELEMENTS
     * ==========================================
     */

    const form =
        document.getElementById('studentForm');

    const message =
        document.getElementById('message');


    /*
     * ==========================================
     * LOAD CLASSES
     * ==========================================
     */

    async function loadClasses() {

        const classSelect =
            document.getElementById('class_id');


        try {

            const response = await fetch(
                '/api/classes',
                {
                    headers: {
                        'Authorization':
                            `Bearer ${token}`
                    }
                }
            );


            const classes =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    classes.message ||
                    'Failed to load classes.'
                );

            }


            classSelect.innerHTML =
                '<option value="">Select class</option>';


            classes.forEach(item => {

                const option =
                    document.createElement('option');


                option.value =
                    item.class_id;


                option.textContent =
                    `${item.class_name} — ${item.arm}`;


                classSelect.appendChild(option);

            });


        } catch (error) {

            console.error(
                'Failed to load classes:',
                error
            );


            classSelect.innerHTML =
                `
                <option value="">
                    Unable to load classes
                </option>
                `;

        }

    }


    /*
     * ==========================================
     * LOAD GUARDIANS
     * ==========================================
     */

    async function loadGuardians() {

        const guardianSelect =
            document.getElementById('guardian_id');


        try {

            const response = await fetch(
                '/api/guardians',
                {
                    headers: {
                        'Authorization':
                            `Bearer ${token}`
                    }
                }
            );


            const guardians =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    guardians.message ||
                    'Failed to load guardians.'
                );

            }


            guardianSelect.innerHTML =
                '<option value="">Select guardian</option>';


            guardians.forEach(item => {

                const option =
                    document.createElement('option');


                option.value =
                    item.guardian_id;


                option.textContent =
                    `${item.full_name} — ${
                        item.relationship ||
                        'Guardian'
                    }`;


                guardianSelect.appendChild(option);

            });


        } catch (error) {

            console.error(
                'Failed to load guardians:',
                error
            );


            guardianSelect.innerHTML =
                `
                <option value="">
                    Unable to load guardians
                </option>
                `;

        }

    }


    /*
     * Load database information
     * when the page opens.
     */

    loadClasses();
    loadGuardians();


    /*
     * ==========================================
     * STUDENT REGISTRATION
     * ==========================================
     */

    form.addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();


            /*
             * Show processing message
             */

            message.style.display =
                'block';

            message.className =
                'info';

            message.textContent =
                'Submitting registration...';


            /*
             * Collect student information
             */

            const student = {

                admission_number:
                    document.getElementById(
                        'admission_number'
                    ).value.trim(),


                first_name:
                    document.getElementById(
                        'first_name'
                    ).value.trim(),


                middle_name:
                    document.getElementById(
                        'middle_name'
                    ).value.trim(),


                last_name:
                    document.getElementById(
                        'last_name'
                    ).value.trim(),


                gender:
                    document.getElementById(
                        'gender'
                    ).value || null,


                date_of_birth:
                    document.getElementById(
                        'date_of_birth'
                    ).value || null,


                phone:
                    document.getElementById(
                        'phone'
                    ).value.trim(),


                address:
                    document.getElementById(
                        'address'
                    ).value.trim(),


                nationality:
                    document.getElementById(
                        'nationality'
                    ).value.trim(),


                previous_school:
                    document.getElementById(
                        'previous_school'
                    ).value.trim(),


                /*
                 * Class ID from dropdown
                 */

                class_id:
                    document.getElementById(
                        'class_id'
                    ).value || null,


                /*
                 * Guardian ID from dropdown
                 */

                guardian_id:
                    document.getElementById(
                        'guardian_id'
                    ).value || null,


                admission_date:
                    document.getElementById(
                        'admission_date'
                    ).value || null,


                emergency_contact_name:
                    document.getElementById(
                        'emergency_contact_name'
                    ).value.trim(),


                emergency_contact_phone:
                    document.getElementById(
                        'emergency_contact_phone'
                    ).value.trim(),


                emergency_contact_relationship:
                    document.getElementById(
                        'emergency_contact_relationship'
                    ).value.trim(),


                /*
                 * Approval workflow
                 */

                student_status:
                    'Pending'

            };


            /*
             * ==========================================
             * SEND TO SERVER
             * ==========================================
             */

            try {

                const response =
                    await fetch(
                        '/api/students',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    `Bearer ${token}`
                            },

                            body:
                                JSON.stringify(student)
                        }
                    );


                const data =
                    await response.json();


                /*
                 * Server rejected request
                 */

                if (!response.ok) {

                    message.className =
                        'error';

                    message.textContent =
                        data.message ||
                        'Registration failed.';

                    console.error(
                        'Registration error:',
                        data
                    );

                    return;

                }


                /*
                 * Successful registration
                 */

                message.className =
                    'success';

                message.textContent =
                    'Student registration submitted successfully. ' +
                    'It is now pending approval.';


                /*
                 * Clear the form
                 */

                form.reset();


                /*
                 * Reload dropdowns because
                 * the form has been reset.
                 */

                await loadClasses();
                await loadGuardians();


            } catch (error) {

                console.error(
                    'Registration error:',
                    error
                );


                message.className =
                    'error';

                message.textContent =
                    'Unable to connect to the server.';

            }

        }
    );

</script>

</body>
</html>
